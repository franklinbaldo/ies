[package]
name = "ies"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CLI Rust para interacao com o SEI, guiada por contratos de dominio"

[dependencies]
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
iesei = { path = "crates/iesei" }
native-tls = "0.2.18"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
html-escape = "0.2"
form_urlencoded = "1"
time = { version = "0.3", features = ["parsing", "macros"] }
thiserror = "2"
tl = "0.7.8"

# Só os testes leem cassettes (ZIP do acervo e SHA-1 do card): o binário de
# produção não liga `zip` nem `sha1`. `base64` segue em [dependencies] porque
# o proxy monta `Proxy-Authorization: Basic` em produção.
[dev-dependencies]
cucumber = "0.23"
futures = "0.3"
anti-ies = { path = "crates/anti-ies" }
sha1 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace]
members = ["xtask", "crates/iesei", "crates/anti-ies"]
resolver = "3"

[[test]]
name = "bdd_cli"
harness = false
