[package]
name = "ies"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CLI Rust para interacao com o SEI, guiada por contratos de dominio"

[dependencies]
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
ies-core = { path = "crates/ies-core" }
native-tls = "0.2.18"
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
tl = "0.7.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace]
members = ["xtask", "crates/ies-core"]
resolver = "3"
