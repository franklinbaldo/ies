[package]
name = "ies"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CLI Rust para interacao com o SEI, guiada por contratos de dominio"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
minreq = { version = "2.14", features = ["https-native"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tl = "0.7.8"
zip = { version = "4", default-features = false, features = ["deflate"] }

[workspace]
members = ["xtask"]
resolver = "3"
