[package]
name = "ies"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "CLI Rust para interacao com o SEI, guiada por contratos de dominio"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
iesei = { path = "crates/iesei" }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
html-escape = "0.2"
form_urlencoded = "1"
time = { version = "0.3", features = ["parsing", "macros"] }
thiserror = "2"
anyhow = "1"
tl = "0.7.8"

# Só os testes leem cassettes (ZIP do acervo, corpos em base64 e SHA-1 do
# card): o binário de produção não liga `zip`, `base64` nem `sha1`.
[dev-dependencies]
base64 = "0.23"
native-tls = "0.2.18"
anti-ies = { path = "crates/anti-ies" }
sha1 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "sei"
path = "src/main.rs"

[[bin]]
name = "ies-cli"
path = "src/main.rs"

[workspace]
members = ["xtask", "crates/iesei", "crates/anti-ies"]
resolver = "3"
