# cargo-deny: só avisos de segurança (RustSec) das dependências do Cargo.lock.
# Aviso aceito entra em `ignore` com `id` e `reason` (por que não se aplica ao
# IES e quando revisar). Ver docs/ci.md.
[advisories]
ignore = [
    # zvariant, zbus_names e zvariant_derive (família zbus 5) vêm do cofre de
    # Secret Service do keyring no Linux (keyring 4.2 -> secret-service 5.2 ->
    # zbus 5.19). Aviso de crate sem manutenção avulsa, não vulnerabilidade:
    # o zbus 6 absorveu as três. Não há versão estável do secret-service sobre
    # o zbus 6 (só 6.0.0-rc.1). Revisar quando keyring/secret-service saírem
    # sobre o zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: família zbus 5 do Secret Service do keyring; sem manutenção avulsa (absorvido pelo zbus 6), sem versão estável a migrar" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: família zbus 5 do Secret Service do keyring; sem manutenção avulsa (absorvido pelo zbus 6), sem versão estável a migrar" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: família zbus 5 do Secret Service do keyring; sem manutenção avulsa (absorvido pelo zbus 6), sem versão estável a migrar" },
]
