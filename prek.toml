default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "tamanho"
name = "Arquivos texto <= 20.000 bytes"
entry = "cargo run --quiet --locked -p xtask --bin check_size"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

[[repos.hooks]]
id = "formato"
name = "Rustfmt"
entry = "cargo fmt --all -- --check"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

[[repos.hooks]]
id = "okf"
name = "OKF estrito em todos os Markdown"
entry = "uvx --from okf-parser==0.48.2 okf-parser check . --require-spec .okf/specs/{slug}.md --normative-spec"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit", "pre-push"]

[[repos.hooks]]
id = "lint"
name = "Clippy rigoroso sem warnings"
entry = "cargo clippy --locked --workspace --all-targets -- -D warnings -W clippy::pedantic"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "testes"
name = "Suite Rust"
entry = "cargo test --locked --workspace --all-targets"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "evidencias"
name = "Relações OKF de operações e cassettes"
entry = "cargo run --quiet --locked -p xtask --bin check_evidence"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]

[[repos.hooks]]
id = "decisoes"
name = "Decisões de engenharia por operação implementada"
entry = "cargo run --quiet --locked -p xtask --bin check_design"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-push"]
