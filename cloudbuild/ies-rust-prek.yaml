# Candidato revisável para o trigger externo ies-pr-ci (issue #76).
# NÃO ativa nem altera o trigger por si só; requer revisão independente.
# Preserva o gate pre-push canônico e a versão uv 0.13.5 da main IES Rust.
steps:
  - id: uv-pinned
    name: ghcr.io/astral-sh/uv@sha256:477cd3e9492fa6199f4d524198fa75ec03f1c7a64c566cdc7e05fe290042fa3a
    entrypoint: sh
    volumes:
      - name: ies-ci-tools
        path: /ci-tools
    args:
      - -ceu
      - |
        # Ferramenta transiente em volume do build, fora do checkout da PR.
        cp "$(command -v uv)" /ci-tools/uv
  - id: rust-prek
    # Imagem oficial Rust 1.99.1: índice OCI imutável verificado no Docker Hub.
    name: docker.io/library/rust@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
    entrypoint: bash
    volumes:
      - name: ies-ci-tools
        path: /ci-tools
    args:
      - -ceu
      - |
        # Volume nomeado só desta execução: arquivos do checkout nunca o preenchem.
        printf '#!/bin/sh\nexec /ci-tools/uv tool run "$$@"\n' > /ci-tools/uvx
        chmod 0755 /ci-tools/uvx
        export PATH="/ci-tools:$$PATH"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          git init --quiet
          git add --all
        fi
        rustup component add rustfmt clippy
        uv --version
        rustc --version
        uvx --from prek==0.5.7 prek run --hook-stage pre-push --all-files
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
