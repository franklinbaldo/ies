# Candidato revisável para o trigger externo ies-pr-ci (issue #76).
# NÃO ativa nem altera o trigger por si só; requer revisão independente.
# SEGURANÇA: jamais usar este YAML como `filename` vindo da branch da PR.
# Um autor de PR poderia alterá-lo e substituir os testes por sucesso falso.
# Depois da revisão, aplicar a receita aprovada como build INLINE no trigger,
# fora do código não confiável, e auditar o resultado com auditar-trigger.sh.
# Preserva o gate pre-push canônico e a versão uv 0.13.5 da main IES Rust.
steps:
  - id: uv-pinned
    name: ghcr.io/astral-sh/uv@sha256:477cd3e9492fa6199f4d524198fa75ec03f1c7a64c566cdc7e05fe290042fa3a
    entrypoint: sh
    volumes:
      - name: ies-ci-tools
        path: /ci-tools
    args:
      - -ceu
      - |
        # Ferramenta transiente em volume do build, fora do checkout da PR.
        cp "$(command -v uv)" /ci-tools/uv
  - id: rust-prek
    # Imagem oficial Rust 1.99.1: índice OCI imutável verificado no Docker Hub.
    name: docker.io/library/rust@sha256:09027f873d45b8ecd1dc86f1fa13b7a62b875c961f017a0e331267b350430137
    entrypoint: bash
    volumes:
      - name: ies-ci-tools
        path: /ci-tools
    args:
      - -ceu
      - |
        # Volume nomeado só desta execução: arquivos do checkout nunca o preenchem.
        printf '#!/bin/sh\nexec /ci-tools/uv tool run "$$@"\n' > /ci-tools/uvx
        chmod 0755 /ci-tools/uvx
        export PATH="/ci-tools:$$PATH"
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          git init --quiet
          # O snapshot nao vem com .git; .gitignore pertence a PR nao confiavel.
          # Indexar TODOS os arquivos antes de prek/check_size (fail closed).
          git add --force --all
        fi
        rustup component add rustfmt clippy
        # INICIO_POLITICA_CONFIAVEL
        # Estes SHA-256 são aprovados a partir da main, fora do checkout da PR.
        # Uma PR que altera gates/toolchain deve ter revisão da política antes.
        printf '%s\n' \
          '48b0c8e2e27d4c242c1c14d02835e38e4c0731f41dcb61b4a360200d74dad568  prek.toml' \
          'd13306be0ecda81ce779baa290ffb417380d525928477f16200884b5169cca33  rust-toolchain.toml' \
          'e65f44384e703d19d96028376dd597e26924fbe59dbd200040b1e7ced6b6df20  Cargo.toml' \
          | sha256sum --check --status
        # Cargo executa xtask/build.rs automaticamente, mesmo sem declarar
        # esse arquivo no manifesto. Proteger a árvore inteira, não somente
        # os binários atuais. Alterações de checker pedem revisão independente.
        if find xtask -type l -print -quit | grep -q .; then
          echo 'FAIL: xtask contém link simbólico não aprovado' >&2
          exit 1
        fi
        arvore_xtask="$(find xtask -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
        if [ "$${arvore_xtask}" != '6f44fdf813acd54ee0b2a8df7eb36ab4727dbcc52f02d0989ad5a78d091b8725' ]; then
          echo 'FAIL: código de xtask difere do conjunto aprovado na main' >&2
          exit 1
        fi
        # FIM_POLITICA_CONFIAVEL
        uv --version
        rustc --version
        uvx --from prek==0.5.7 prek run --hook-stage pre-push --all-files
serviceAccount: projects/virtual-computer-fsb/serviceAccounts/ies-ci@virtual-computer-fsb.iam.gserviceaccount.com
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
