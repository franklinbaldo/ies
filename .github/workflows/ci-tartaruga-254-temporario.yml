name: Teste temporario da Tartaruga #254
on:
  push:
    branches:
      - codex/254-tartaruga-exclusao
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # O gate wip-ignores exige o merge de PR com primeiro pai na main.
          ref: refs/pull/293/merge
          fetch-depth: 2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.5"
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: uvx --from prek==0.5.7 prek run --hook-stage pre-push --all-files
