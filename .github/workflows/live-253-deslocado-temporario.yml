name: Validacao live deslocamento #253 (temporaria, uma vez)
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: live-253-deslocado-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  leitura-deslocada:
    if: github.event.pull_request.head.ref == 'codex/253-unidade-retornos' && github.run_attempt == 1
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout seguro
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Guard por commit unico
        id: guard
        shell: bash
        run: |
          if [ "$(git log -1 --format=%s)" = "live(#253): ensaio unico deslocamento PEN3 dezembro" ]; then
            echo 'executar=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executar=false' >> "$GITHUB_OUTPUT"
            echo "NOT_RUN: commit diferente, nenhuma requisicao SEI"
          fi
      - name: Rust 1.99.1
        if: steps.guard.outputs.executar == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compilar binario
        if: steps.guard.outputs.executar == 'true'
        run: cargo +1.99.1 build --locked --release --bin ies
      - name: Uma sessao PEN3 treinamento — deslocar para dezembro e consultar hoje
        if: steps.guard.outputs.executar == 'true'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          D=$(mktemp -d)
          trap 'rm -rf "$D"' EXIT
          python3 -I - "$D" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          linhas=pathlib.Path("docs/interfaces/credenciais-de-treinamento.md").read_text().splitlines()
          valores=[]
          for linha in linhas:
              if not linha.startswith("| `pen3`"):
                  continue
              valores.append([x.strip().strip("`") for x in linha.strip("|").split("|")])
          if len(valores)!=1 or len(valores[0])<6:
              raise SystemExit("NOT_RUN: credenciais de treinamento nao identificadas")
          _,_,origem,usuario,senha,orgao=valores[0][:6]
          if origem!="https://sei.orgao3.tramita.processoeletronico.gov.br/sei":
              raise SystemExit("NOT_RUN: origem nao e PEN3 de treinamento")
          for nome,conteudo in [
              ("origem",origem+"\n"),
              ("credenciais",f"usuario={usuario}\nsenha={senha}\norgao={orgao}\n"),
          ]:
              f=p/nome
              f.write_text(conteudo)
              f.chmod(0o600)
          PY
          export IES_ORIGEM_FILE="$D/origem" IES_COOKIE_FILE="$D/cookie"
          export IES_URL_CONTROLE_FILE="$D/url-controle" IES_CREDENCIAIS_FILE="$D/credenciais"
          informar() {
            python3 -I - "$1" "$2" "$3" <<'PY'
          import json,pathlib,sys
          p,etapa,rc=sys.argv[1:]
          try:
              obj=json.loads(pathlib.Path(p).read_text())
          except (ValueError,OSError):
              obj={}
          campos=("codigo","subcodigo","requisicoes","status_http","mes","total_declarado","faixa_observada","conexao")
          print(etapa,"saida",rc,{k:obj[k] for k in campos if k in obj})
          PY
          }
          echo "PEN3 TREINAMENTO: login unico; nao repetir erro"
          rc=0
          ./target/release/ies --json login > "$D/login.json" 2> "$D/login.err" || rc=$?
          informar "$D/login.json" login "$rc"
          if [ "$rc" -ne 0 ]; then echo 'NOT_RUN: login falhou; parada sem retry'; exit 0; fi
          sleep 65
          echo "PEN3 TREINAMENTO: leitura nova --mes 2026-12 para observar eventual deslocamento de calendario"
          rc=0
          ./target/release/ies --json unidade retornos --mes 2026-12 > "$D/dez.json" 2> "$D/dez.err" || rc=$?
          informar "$D/dez.json" dezembro "$rc"
          if [ "$rc" -ne 0 ]; then echo "FAIL: nao repetir consulta a dezembro; caminho seguinte NOT_RUN"; exit 0; fi
          sleep 65
          echo "PEN3 TREINAMENTO: leitura unica sem --mes, sem restaurar a tela"
          rc=0
          ./target/release/ies --json unidade retornos > "$D/hoje.json" 2> "$D/hoje.err" || rc=$?
          informar "$D/hoje.json" sem_mes "$rc"
          if [ "$rc" -ne 0 ]; then echo "FAIL: sem --mes; nenhum retry"; exit 0; fi
          python3 -I - "$D/dez.json" "$D/hoje.json" <<'PY'
          import json,sys
          d,h=[json.load(open(p)) for p in sys.argv[1:]]
          if d.get("mes")!="2026-12":
              print("INCONCLUSIVO: primeira leitura nao confirmou dezembro")
          elif h.get("mes")=="2026-11" and h.get("requisicoes")==4:
              print("PASS: leitura sem mes identificou novembro via salto real (4 GET)")
          elif h.get("mes")=="2026-11":
              print("PARCIAL: novembro lido, mas sem prova de calendario deslocado; GETs =",h.get("requisicoes"))
          else:
              print("INCONCLUSIVO: hoje publicado diferente do esperado; sem data inventada")
          PY
          echo "Sem POST, sem escrita, sem retry e sem restauracao da tela."
