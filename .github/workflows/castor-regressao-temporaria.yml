name: Castor teste temporario relacao bilateral
on:
  push:
    branches:
      - codex/castor-258-relacionar-aies-bdd01
permissions:
  contents: read
jobs:
  regressao:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout da PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust fixado
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: RED anterior à correção deve falhar
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 70b53b135eab4c4aaaf375f378355cc95b769893
          if cargo +1.99.1 test --locked -p iesei --test relacionamentos_simetria; then
            echo 'ERRO: teste RED não falhou'
            exit 1
          fi
          echo 'RED comprovado: falha reproduzida antes da correção'
      - name: GREEN corrigido deve passar
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach fdddc64df775364964e5797be5cc13c971c0c198
          cargo +1.99.1 test --locked -p iesei --test relacionamentos_simetria
          cargo +1.99.1 fmt --all -- --check
