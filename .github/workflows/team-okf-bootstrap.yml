name: TeamMember OKF bootstrap (temporario)
on:
  push:
    branches: [docs/team-okf-agent-profiles-20261106]
permissions:
  contents: write
jobs:
  okf-init:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Gerar unico tipo a partir de team/
        run: |
          set -euo pipefail
          test ! -e .okf/specs/teammember.md
          uvx --from okf-parser==0.48.2 okf-parser init team --spec-template '.okf/specs/{slug}.md' --write --infer-schema
          test -f team/.okf/specs/teammember.md
          test -f team/.okf/specs/teammember.schema.sql
          test "$(find team/.okf/specs -type f | wc -l)" -eq 2
          mv team/.okf/specs/teammember.md .okf/specs/
          mv team/.okf/specs/teammember.schema.sql .okf/specs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .okf/specs/teammember.*
          git commit -m "docs(okf): init TeamMember via uvx"
          git push origin HEAD:docs/team-okf-agent-profiles-20261106
