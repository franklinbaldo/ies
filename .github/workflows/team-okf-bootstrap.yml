name: Bootstrap tipos OKF da equipe (temporario)
on:
  push:
    branches: [docs/team-okf-agent-profiles-20261106]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  init-team:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Inicializar tipos a partir das fichas via uvx
        run: |
          set -euo pipefail
          uvx --from okf-parser==0.48.2 okf-parser init . --write --infer-schema
          test "$(find .okf/specs -maxdepth 1 -name 'agent*.md' | wc -l)" -eq 7
          test "$(find .okf/specs -maxdepth 1 -name 'agent*.schema.sql' | wc -l)" -eq 7
      - name: Registrar os arquivos gerados em branch de documentacao
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .okf/specs/
          if ! git diff --cached --quiet; then
            git commit -m "docs(okf): inicializar sete tipos da equipe via uvx"
            git push origin HEAD:docs/team-okf-agent-profiles-20261106
          fi
