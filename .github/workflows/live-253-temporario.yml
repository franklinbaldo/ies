name: Live leitura #253 (temporario)
on:
  pull_request:
permissions:
  contents: read
jobs:
  live:
    if: github.event.pull_request.head.ref == 'codex/253-unidade-retornos'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout do head, sem credenciais persistidas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Guard de execucao unica sem retry
        id: guard
        shell: bash
        run: |
          if [ "$(git log -1 --format=%s)" = "live(#253): primeira leitura PEN3 sem repetir GO" ]; then
            echo 'executar=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executar=false' >> "$GITHUB_OUTPUT"
            echo 'NOT_RUN: este commit nao e o gatilho de leitura ao vivo'
          fi
      - name: Rust 1.99.1
        if: steps.guard.outputs.executar == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compilar binario release
        if: steps.guard.outputs.executar == 'true'
        run: cargo build --locked --release
      - name: Leitura de treinamento PEN3 (GO ja tentado), sem retry nem vazar sessao
        if: steps.guard.outputs.executar == 'true'
        shell: bash
        run: |
          set +e
          set -u
          umask 077
          falhas=0
          for inst in pen3; do
            echo "INSTALACAO=$inst"
            D=$(mktemp -d)
            python3 -I - "$inst" "$D" <<'PY'
          import os, pathlib, sys
          nome, diretorio = sys.argv[1:]
          p = pathlib.Path(diretorio)
          texto = pathlib.Path("docs/interfaces/credenciais-de-treinamento.md").read_text()
          linhas = [linha for linha in texto.splitlines() if linha.startswith("| `")]
          achadas = []
          for linha in linhas:
              campos = [c.strip().strip("`") for c in linha.strip("|").split("|")]
              if campos[0] == nome:
                  achadas.append(campos)
          if len(achadas) != 1:
              raise RuntimeError("instalacao nao identificada na tabela oficial")
          campos = achadas[0]
          origem, usuario, senha, orgao = campos[2:6]
          for arquivo, valor in (
              ("origem", origem + "\n"),
              ("credenciais", f"usuario={usuario}\nsenha={senha}\norgao={orgao}\n"),
          ):
              destino = p / arquivo
              destino.write_text(valor)
              destino.chmod(0o600)
          PY
            export IES_ORIGEM_FILE="$D/origem" IES_COOKIE_FILE="$D/cookie"
            export IES_URL_CONTROLE_FILE="$D/url-controle" IES_CREDENCIAIS_FILE="$D/credenciais"
            ./target/release/ies --json login > "$D/login.json" 2> "$D/login.err"
            rc=$?
            python3 -I - "$D/login.json" "$inst" "$rc" 'login' <<'PY'
          import json, pathlib, sys
          try:
              o = json.loads(pathlib.Path(sys.argv[1]).read_text())
          except (OSError, ValueError):
              o = {}
          permitido = ("codigo", "subcodigo", "conexao", "requisicoes", "status_http", "unidade_exibida")
          print(sys.argv[2], sys.argv[4], "saida", sys.argv[3],
                {k: o[k] for k in permitido if k in o})
          PY
            if [ "$rc" -ne 0 ]; then
              echo "$inst: NOT_RUN retornos (login recusado; sem nova tentativa)"
              falhas=1
              rm -rf "$D"
              sleep 65
              continue
            fi
            sleep 65
            ./target/release/ies --json unidade retornos --mes 2026-10 > "$D/retornos.json" 2> "$D/retornos.err"
            rc=$?
            python3 -I - "$D/retornos.json" "$inst" "$rc" 'retornos' <<'PY'
          import json, pathlib, sys
          try:
              o = json.loads(pathlib.Path(sys.argv[1]).read_text())
          except (OSError, ValueError):
              o = {}
          permitido = ("codigo", "subcodigo", "requisicoes", "status_http", "mes",
                       "total_declarado", "faixa_observada")
          print(sys.argv[2], sys.argv[4], "saida", sys.argv[3],
                {k: o[k] for k in permitido if k in o})
          PY
            if [ "$rc" -ne 0 ]; then
              falhas=1
            fi
            rm -rf "$D"
            sleep 65
          done
          exit "$falhas"
