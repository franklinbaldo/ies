name: DRY AST experiment (temporary)
on:
  push:
    branches: [codex/dry-ast-wide-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Run global dry audit
        run: |
          set -o pipefail
          uvx --with tree-sitter==0.24.0 --with tree-sitter-rust==0.23.2 python scripts/dry_ast.py --apply | tee dry-audit.json
          uvx --with tree-sitter==0.24.0 --with tree-sitter-rust==0.23.2 python scripts/dry_ast.py --check
          echo "## Arquivos modificados pelo codemod"
          git diff --stat
          echo "## Exemplo de diff Rust"
          git diff -- src/processo_concluir_cli.rs src/saida.rs
          echo "## Verificação sintática"
          cargo fmt --all --check
