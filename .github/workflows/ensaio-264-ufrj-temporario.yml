# Temporário: somente prévia/leitura UFRJ treinamento. Remover antes de nova revisão.
name: ensaio temporario #264 UFRJ (somente leitura)
on:
  push:
    branches: [codex/264-atribuicao-post-preparado]
permissions:
  contents: read
jobs:
  previa_ufrj:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build ies
        run: cargo +1.99.1 build --release --locked --bin ies
      - name: Prévia UFRJ sem escrita
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          localdir="$RUNNER_TEMP/ies264ufrj"
          mkdir -m 700 -p "$localdir"
          trap 'rm -rf "$localdir"' EXIT
          # Credenciais públicas vêm da documentação, nunca de literal em argumento/log.
          python3 - "$localdir" <<'PY'
          import os
          from pathlib import Path
          import sys
          dest = Path(sys.argv[1])
          row = next(line for line in Path("docs/interfaces/credenciais-de-treinamento.md").read_text().splitlines() if line.startswith("| `ufrj` |"))
          cells = [c.strip().strip("`") for c in row.strip("|").split("|")]
          origin, user, password, org = cells[2], cells[3], cells[4], cells[5]
          for name, value in (("origem", origin + "\n"), ("cred", f"usuario={user}\nsenha={password}\norgao={org}\n"), ("cookie", ""), ("controle", "")):
              fd = os.open(dest / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, "w") as file:
                  file.write(value)
          PY
          export IES_ORIGEM_FILE="$localdir/origem"
          export IES_CREDENCIAIS_FILE="$localdir/cred"
          export IES_COOKIE_FILE="$localdir/cookie"
          export IES_URL_CONTROLE_FILE="$localdir/controle"
          export IES_SEM_INDICE=1
          set +e
          ./target/release/ies --json login >"$localdir/login.out" 2>"$localdir/login.err"
          login_rc=$?
          set -e
          python3 - "$localdir/login.out" "$login_rc" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except (ValueError, OSError):
              data = {}
          print(json.dumps({"etapa": "login_ufrj", "saida": int(sys.argv[2]), "subcodigo": data.get("subcodigo"), "requisicoes": data.get("requisicoes")}, ensure_ascii=False))
          PY
          if [ "$login_rc" -ne 0 ]; then exit 0; fi
          sleep 35
          nup="99079.901790/2026-43"
          set +e
          ./target/release/ies --json processo "$nup" >"$localdir/estado.out" 2>"$localdir/estado.err"
          estado_rc=$?
          set -e
          python3 - "$localdir/estado.out" "$estado_rc" "$localdir/opcao" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except (ValueError, OSError):
              data = {}
          aberto = data.get("aberto_em", [])
          unidade = next((u for u in aberto if isinstance(u, dict) and u.get("sigla") == "PR-P"), None) if isinstance(aberto, list) else None
          op = None
          assigned = None
          if unidade is not None and int(sys.argv[2]) == 0:
              attr = unidade.get("atribuido_a")
              assigned = attr.get("sigla") if isinstance(attr, dict) else None
              op = "--remover" if assigned else "--usuario"
              with open(sys.argv[3], "w") as file:
                  file.write(op)
          print(json.dumps({"etapa":"leitura_ufrj_segundo_nup", "saida":int(sys.argv[2]), "subcodigo":data.get("subcodigo"), "requisicoes":data.get("requisicoes"), "unidade_na_arvore":unidade is not None, "atribuido_na_unidade":bool(assigned), "opcao_previa":op}, ensure_ascii=False))
          PY
          if [ ! -s "$localdir/opcao" ]; then exit 0; fi
          sleep 35
          if [ "$(cat "$localdir/opcao")" = "--remover" ]; then
            set +e
            ./target/release/ies --json processo atribuir "$nup" --remover >"$localdir/previa.out" 2>"$localdir/previa.err"
            previa_rc=$?
            set -e
          else
            set +e
            ./target/release/ies --json processo atribuir "$nup" --usuario servidor1 >"$localdir/previa.out" 2>"$localdir/previa.err"
            previa_rc=$?
            set -e
          fi
          python3 - "$localdir/previa.out" "$previa_rc" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except (ValueError, OSError):
              data = {}
          print(json.dumps({"etapa":"previa_ufrj_segundo_nup", "saida":int(sys.argv[2]), "subcodigo":data.get("subcodigo"), "requisicoes":data.get("requisicoes"), "confirmado":data.get("confirmado"), "alterado":data.get("alterado"), "sem_post": True}, ensure_ascii=False))
          PY
          # Nunca usar --confirmar. Processos anteriores não são repetidos.
