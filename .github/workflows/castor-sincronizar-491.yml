name: "🦫 Castor — sincronizar PR 491 com main"
on:
  push:
    branches: [codex/castor-258-relacionar-aies-bdd01]
    paths: [.github/workflows/castor-sincronizar-491.yml]
permissions:
  contents: write
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Incorporar main e conciliar só os 6 conflitos verificados
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/castor-258-relacionar-aies-bdd01"
          git fetch origin main
          git config user.name "Castor (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-ff --no-edit -m "🦫 merge: incorporar main na PR #491" origin/main; then
            python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          expected = {
              "crates/anti-ies/src/lib.rs": 1,
              "crates/anti-ies/src/rotas.rs": 2,
              "crates/iesei/src/banco_cassettes.rs": 1,
              "crates/iesei/src/documentos_simulados.rs": 1,
              "crates/iesei/tests/banco_cassettes.rs": 1,
              "crates/iesei/tests/retornos_cassettes.rs": 1,
          }
          unmerged = set(subprocess.check_output(["git","diff","--name-only","--diff-filter=U"], text=True).splitlines())
          assert unmerged == set(expected), ("Conflitos inesperados", unmerged)
          pat = re.compile(r"^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> origin/main\n", re.S|re.M)
          for path, count in expected.items():
              source = Path(path).read_text()
              matches = list(pat.finditer(source))
              assert len(matches) == count, (path, len(matches))
              def resolve(match):
                  left, right = match.group(1), match.group(2)
                  if path.endswith("anti-ies/src/lib.rs"):
                      assert "mod processo_relacionar;" in left and "mod protocolo_sintetico;" in right
                      return left+right
                  if path.endswith("anti-ies/src/rotas.rs"):
                      if "processo_relacionar," in left:
                          assert "documento_cancelar," in right
                          assert "processo_envio, retorno_programado," in right
                          return right.replace("processo_envio, retorno_programado,", "processo_envio, processo_relacionar, retorno_programado,")
                      assert "Some(\"procedimento_relacionar\")" in left and "Some(\"protocolo_pesquisar\")" in right
                      assert "protocolo_RI1023" in left
                      return left+"        }\n"+right
                  if path.endswith("iesei/src/banco_cassettes.rs"):
                      assert "0015_processo_relacionamentos.sql" in left
                      assert "0013_cancelamento_documento.sql" in right and "0014_pesquisa_documento_sem_resultado.sql" in right
                      return right.rstrip()+",\n    \"\\n\",\n"+left
                  if path.endswith("iesei/src/documentos_simulados.rs"):
                      assert left.strip()=="15" and right.strip()=="14"
                      return left
                  if path.endswith("iesei/tests/banco_cassettes.rs"):
                      assert "assert_eq!(version, 15);" in left and "assert_eq!(version, 14);" in right
                      return "    // O esquema derivado inclui relacionamentos e busca negativa observada.\n    assert_eq!(version, 15);\n"
                  if path.endswith("iesei/tests/retornos_cassettes.rs"):
                      assert "assert_eq!(versao, 15);" in left and "assert_eq!(versao, 14);" in right
                      return "    // O esquema derivado v15 preserva a identidade dos retornos.\n    assert_eq!(versao, 15);\n"
                  raise AssertionError(path)
              result = pat.sub(resolve, source)
              assert "<<<<<<<" not in result and ">>>>>>>" not in result, path
              Path(path).write_text(result)
              print("RESOLVIDO:",path)
          PY
            git add crates/anti-ies/src/lib.rs crates/anti-ies/src/rotas.rs crates/iesei/src/banco_cassettes.rs crates/iesei/src/documentos_simulados.rs crates/iesei/tests/banco_cassettes.rs crates/iesei/tests/retornos_cassettes.rs
            test -z "$(git ls-files -u)"
            git diff --cached --check -- crates/anti-ies/src/lib.rs crates/anti-ies/src/rotas.rs crates/iesei/src/banco_cassettes.rs crates/iesei/src/documentos_simulados.rs crates/iesei/tests/banco_cassettes.rs crates/iesei/tests/retornos_cassettes.rs
            git commit -m "🦫 merge: conciliar relacionamentos v15 com cancelamento v13 e busca v14"
          fi
          git push origin HEAD:codex/castor-258-relacionar-aies-bdd01
      - name: Retirar workflow transitório após merge
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/castor-sincronizar-491.yml
          git commit -m "🦫 chore: retirar workflow temporário de merge"
          git push origin HEAD:codex/castor-258-relacionar-aies-bdd01
