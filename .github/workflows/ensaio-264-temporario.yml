# Temporário: apenas prévia LEITURA em treinamento. Remover antes da revisão.
name: ensaio temporario #264 (somente leitura)
on:
  push:
    branches: [codex/264-atribuicao-post-preparado]
permissions:
  contents: read
jobs:
  previa_unb:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build ies
        run: cargo +1.99.1 build --release --locked --bin ies
      - name: Uma prévia UnB sem escrita
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          localdir="$RUNNER_TEMP/ies264"
          mkdir -p "$localdir"
          chmod 700 "$localdir"
          # Lê a conta PÚBLICA já documentada, sem reproduzir senha em log, workflow ou argumentos.
          python3 - "$localdir" <<'PY'
          import os
          from pathlib import Path
          import sys
          dest = Path(sys.argv[1])
          rows = Path("docs/interfaces/credenciais-de-treinamento.md").read_text().splitlines()
          row = next(line for line in rows if line.startswith("| `unb` |"))
          cells = [c.strip().strip("`") for c in row.strip("|").split("|")]
          origin, user, password, org = cells[2], cells[3], cells[4], cells[5]
          for name, value in (("origem", origin + "\n"), ("cred", f"usuario={user}\nsenha={password}\norgao={org}\n"), ("cookie", ""), ("controle", "")):
              fd = os.open(dest / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, "w") as file:
                  file.write(value)
          PY
          export IES_ORIGEM_FILE="$localdir/origem"
          export IES_CREDENCIAIS_FILE="$localdir/cred"
          export IES_COOKIE_FILE="$localdir/cookie"
          export IES_URL_CONTROLE_FILE="$localdir/controle"
          export IES_SEM_INDICE=1
          set +e
          ./target/release/ies --json login >"$localdir/login.out" 2>"$localdir/login.err"
          login_rc=$?
          set -e
          python3 - "$localdir/login.out" "$login_rc" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except (ValueError, OSError):
              data = {}
          print(json.dumps({"etapa": "login", "saida": int(sys.argv[2]), "subcodigo": data.get("subcodigo"), "requisicoes": data.get("requisicoes")}, ensure_ascii=False))
          PY
          if [ "$login_rc" -ne 0 ]; then exit 0; fi
          sleep 35
          set +e
          ./target/release/ies --json processo atribuir "23106.001559/2026-11" --usuario aluno2 >"$localdir/previa.out" 2>"$localdir/previa.err"
          previa_rc=$?
          set -e
          python3 - "$localdir/previa.out" "$previa_rc" <<'PY'
          import json, sys
          try:
              data = json.load(open(sys.argv[1]))
          except (ValueError, OSError):
              data = {}
          print(json.dumps({"etapa":"previa_unb", "saida":int(sys.argv[2]), "subcodigo":data.get("subcodigo"), "requisicoes":data.get("requisicoes"), "confirmado":data.get("confirmado"), "alterado":data.get("alterado"), "sem_post": True}, ensure_ascii=False))
          PY
          # Não usar --confirmar nesta validação. Nenhum POST de atribuição.
