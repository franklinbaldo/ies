name: Experimento AST da issue 299 (temporario)
on:
  push:
    branches: [codex/299-origem-unica-erros]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventario:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Gerar inventario AST sem acesso SEI
        run: |
          uvx --with tree-sitter==0.24.0 --with tree-sitter-rust==0.23.2 python scripts/auditar_emissoes_erro.py --json > inventario-299.json
          python - <<'PY'
          import json
          data=json.load(open("inventario-299.json", encoding="utf-8"))
          print(json.dumps({k: v for k,v in data.items() if k not in ("reutilizacoes", "reutilizacoes_html")}, ensure_ascii=False))
          print("Top 15:")
          for d in data["reutilizacoes"][:15]:
              print(d["erro"], d["pontos"], d["locais"][:4])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inventario-erro-299
          path: inventario-299.json
          if-no-files-found: error
