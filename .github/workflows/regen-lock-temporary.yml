name: regenerar-lock-temporario
on:
  push:
    branches:
      - codex/elefante-cassette-e2e-sem-gherkin-20261111
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerar lock com Cargo oficial
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo metadata --format-version 1 > /dev/null
          echo 'BEGIN_CARGO_LOCK_B64'
          base64 -w0 Cargo.lock
          echo
          echo 'END_CARGO_LOCK_B64'
