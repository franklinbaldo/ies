name: CI

on:
  # A suíte completa roda no momento de revisão, nunca em cada commit.
  # Para revalidar depois de novas mudanças: Draft -> Ready for review.
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek (Rust, OKF, 20 KB)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # O gate wip-ignores compara com o primeiro pai do merge.
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy


      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true

      - name: Run canonical prek pre-push gates
        run: uvx --from prek==0.5.7 prek run --hook-stage pre-push --all-files

  binario:
    # Binário para os agentes testarem no sandbox (sem Rust nem rede para
    # instalá-lo). ubuntu-22.04 = glibc 2.35 e libssl3: roda em mais
    # sandboxes que um binário do 24.04. Não é gate nem release.
    name: binário ies (linux x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build release binary
        run: |
          cargo build --release --locked --bin ies
          ./target/release/ies --version
          sha256sum target/release/ies | tee target/release/ies.sha256

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ies-linux-x86_64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            target/release/ies
            target/release/ies.sha256
          retention-days: 7
          if-no-files-found: error

  replay_unidade_retornos:
    # Gate obrigatório: o replay externo não participa da suíte Rust normal.
    # As sete capturas públicas cobrem retornos #253 e atribuição #264.
    name: replay unidade.retornos (7 instalações, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IES_ACERVO_CACHE: .cache/ies-retornos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Restore verified returns cassettes
        id: retornos-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.IES_ACERVO_CACHE }}
          key: ies-retornos-v1-${{ hashFiles('cassettes/retornos-zips.txt') }}
          restore-keys: ies-retornos-v1-

      - name: Download missing cassettes and verify every ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$IES_ACERVO_CACHE"
          base="https://archive.org/download/todos-sei-cassettes-2026"
          while read -r arquivo sha1 url; do
            if ! printf '%s  %s\n' "$sha1" "$IES_ACERVO_CACHE/$arquivo" | sha1sum --check --status; then
              echo "Downloading $arquivo"
              curl --fail --silent --show-error --location --retry 0 --max-time 300 \
                --output "$IES_ACERVO_CACHE/$arquivo" "$base/$url"
            fi
            printf '%s  %s\n' "$sha1" "$IES_ACERVO_CACHE/$arquivo" | sha1sum --check
          done < cassettes/retornos-zips.txt

      - name: Save verified returns cassettes before replay
        if: steps.retornos-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.IES_ACERVO_CACHE }}
          key: ${{ steps.retornos-cache.outputs.cache-primary-key }}

      - name: Replay verified monthly returns with production parser
        run: cargo test --locked --bin ies unidade_retornos::acervo::replay_retornos_no_acervo -- --ignored --exact --nocapture --test-threads=1

      - name: Replay obrigatório do processo atribuir (#264, offline)
        run: cargo +1.99.1 test --locked --bin ies processo_atribuir::acervo::replay_de_processo_atribuir_no_acervo -- --ignored --exact --nocapture --test-threads=1

      - name: Exercitar ensaio único de atribuição sem acessar o SEI
        run: PYTHONPATH=scripts python3 -m unittest scripts.test_ensaio_processo_atribuir scripts.test_ensaio_processo_atribuir_persistencia -v

      - name: Cassette UnB -> SQLite efêmero -> anti-IES -> leitor da CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_ciclo::cassette_unb_controle_r_fecha_ciclo_http_e_leitor_da_cli: test'
          cargo +1.99.1 test --locked --bin ies cassette_unb_controle_r_fecha_ciclo_http_e_leitor_da_cli -- --ignored --nocapture --test-threads=1

      - name: Segunda vertical — retornos mensais UnB por SQLite e HTTP
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_retornos::cassette_unb_retornos_mensais_fecha_ciclo_http_e_leitor: test'
          cargo +1.99.1 test --locked --bin ies cassette_unb_retornos_mensais_fecha_ciclo_http_e_leitor -- --ignored --nocapture --test-threads=1

      - name: Cassette UnB documento -> SQLite -> HTTP -> leitor real
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento::cassette_unb_conteudo_documento_compara_leitores_por_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_unb_conteudo_documento_compara_leitores_por_http -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento::cassette_unb_tela_do_documento_preserva_selecao_ate_arvore_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_unb_tela_do_documento_preserva_selecao_ate_arvore_http -- --ignored --nocapture --test-threads=1

      - name: Confrontar a barra UnB antes/depois da conclusão com HTTP anti-IES
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento_lista::cassette_unb_arvore_concluida_retira_link_de_versoes_no_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_unb_arvore_concluida_retira_link_de_versoes_no_http -- --ignored --nocapture --test-threads=1

      - name: Cassette UnB histórico -> SQLite -> HTTP -> leitor real
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento::cassette_unb_historico_preserva_versoes_e_metadados_por_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_unb_historico_preserva_versoes_e_metadados_por_http -- --ignored --nocapture --test-threads=1


      - name: Cassette GO histórico -> SQLite -> HTTP -> leitor real
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento_lista::cassette_go_historico_preserva_metadados_e_identidade_por_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_go_historico_preserva_metadados_e_identidade_por_http -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento_lista::cassette_ufrj_historico_preserva_metadados_e_identidade_por_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_ufrj_historico_preserva_metadados_e_identidade_por_http -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento_lista::cassette_pen1_historico_e_conteudo_preservam_identidade_por_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_pen1_historico_e_conteudo_preservam_identidade_por_http -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento_lista::cassette_pen2_historico_e_conteudo_preservam_identidade_por_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_pen2_historico_e_conteudo_preservam_identidade_por_http -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento_lista::cassette_pen3_historico_e_conteudo_preservam_identidade_por_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_pen3_historico_e_conteudo_preservam_identidade_por_http -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies -- --list --ignored | grep -F 'cassette::anti_ies_documento_lista::cassette_pen4_historico_e_conteudo_preservam_identidade_por_http: test'
          cargo +1.99.1 test --locked --bin ies cassette_pen4_historico_e_conteudo_preservam_identidade_por_http -- --ignored --nocapture --test-threads=1

  replay-lupa-go:
    # Regressão permanente da #244. ZIP público, hash conferido e apenas
    # respostas gravadas: nunca requisita a instalação do SEI.
    name: replay GO da lupa de unidades
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true

      - name: Download and verify public GO archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ies-acervo"
          curl --fail --location --silent --show-error --retry 0 --max-time 180 \
            --output "$RUNNER_TEMP/ies-acervo/lote-e01c45d573ff1591.zip" \
            "https://archive.org/download/todos-sei-cassettes-2026/lotes/lote-e01c45d573ff1591.zip"
          echo "e01c45d573ff15912f0a5d018165aa3edbf24c89  $RUNNER_TEMP/ies-acervo/lote-e01c45d573ff1591.zip" | sha1sum --check
          curl --fail --location --silent --show-error --retry 0 --max-time 180 \
            --output "$RUNNER_TEMP/ies-acervo/lote-5b6af062ae69d8c7.zip" \
            "https://archive.org/download/todos-sei-cassettes-2026/lotes/lote-5b6af062ae69d8c7.zip"
          echo "5b6af062ae69d8c7db0293c93ce30342c0aa364a  $RUNNER_TEMP/ies-acervo/lote-5b6af062ae69d8c7.zip" | sha1sum --check

      - name: Mandatory offline replay (3 GET, 3 POST from cassette)
        shell: bash
        env:
          IES_ACERVO_CACHE: ${{ runner.temp }}/ies-acervo
        run: |
          set -euo pipefail
          # A ausencia do teste nao pode transformar este gate em sucesso vazio.
          cargo +1.99.1 test --locked --bin ies -- --list --ignored |
            grep -F 'unidade_lupa::acervo::replay_da_lupa_go_no_acervo: test'
          cargo +1.99.1 test --locked --bin ies replay_da_lupa_go_no_acervo -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies replay_274_paginas_go_no_acervo -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies formularios_da_lupa_integral_go_no_acervo -- --ignored --nocapture --test-threads=1
          # #244: observação offline da cassette UnB, no mesmo ZIP público verificado.
          cargo +1.99.1 test --locked --bin ies observacao_dos_links_da_lupa_unb_no_acervo -- --ignored --nocapture --test-threads=1
          cargo +1.99.1 test --locked --bin ies replay_do_fluxo_completo_unb -- --ignored --nocapture --test-threads=1

  replay_documento_criar:
    # Gate obrigatório: a suíte normal não depende de ZIP externo,
    # mas a PR e a main devem conferir e reproduzir o acervo de Goiás.
    name: replay documento.criar (GO, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Download verified public cassette ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ies"
          curl --fail --show-error --silent --location --max-time 240 --retry 0 \
            --output "$HOME/.cache/ies/todos-sei-cassettes-go.zip" \
            https://archive.org/download/todos-sei-cassettes-2026/todos-sei-cassettes-go.zip
          printf '%s  %s\n' \
            '42a08cd3714bb863d136ed98e517221510a31982' \
            "$HOME/.cache/ies/todos-sei-cassettes-go.zip" | sha1sum --check

      - name: Replay with real readers and verified cassette members
        run: cargo test --locked --bin ies documento_criar::acervo::replay_documento_criar_go -- --ignored --exact --nocapture --test-threads=1

  replay-processo-criar:
    # Gate obrigatório da issue #245: o replay não pode ficar só ignorado.
    # ZIPs públicos conferidos por SHA-1; membros por SHA-256 no leitor Rust.
    # Nenhum endpoint SEI é acessado aqui.
    name: replay processo criar (acervo público)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache dos ZIPs públicos conferidos
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/ies-acervo-processo-criar
          key: ies-acervo-processo-criar-${{ hashFiles('cassettes/**/processo-criar-*.md') }}

      - name: Testar a obtenção dos ZIPs sem rede real
        run: python3 -m unittest discover -s scripts/tests -p 'test_baixar_acervo_processo_criar.py' -v

      - name: Testar ensaio manual de escrita única (sem rede ou SEI)
        run: python3 -m unittest discover -s scripts/tests -p 'test_ensaio_processo_criar.py' -v

      - name: Testar conciliação somente leitura de efeito incerto (sem SEI)
        run: python3 -m unittest discover -s scripts/tests -p 'test_reconciliar_processo_criar.py' -v

      - name: Obter ZIPs originais com hashes verificados
        env:
          IES_ACERVO_CACHE: ${{ runner.temp }}/ies-acervo-processo-criar
        run: python3 scripts/baixar_acervo_processo_criar.py

      - name: Executar obrigatoriamente o replay dos leitores Rust
        env:
          IES_ACERVO_CACHE: ${{ runner.temp }}/ies-acervo-processo-criar
        run: scripts/replay processo_criar_fluxo::acervo::replay_de_processo_criar_no_acervo

  replay-ciencia:
    # Gate permanente da #271: ZIPs públicos conferidos, nenhum endpoint SEI.
    name: replay ciência (14 cards, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache dos ZIPs públicos de ciência
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/ies-acervo-ciencia
          key: ies-ciencia-v1-${{ hashFiles('cassettes/**/processo-ciente-*.md', 'cassettes/**/documento-ciente-*.md') }}

      - name: Verificar contrato de obtenção dos ZIPs sem rede
        run: python3 -m unittest discover -s scripts/tests -p 'test_baixar_acervo_ciencia.py' -v

      - name: Obter ZIPs públicos e conferir SHA-1
        env:
          IES_ACERVO_CACHE: ${{ runner.temp }}/ies-acervo-ciencia
        run: python3 scripts/baixar_acervo_ciencia.py

      - name: Executar replay dedicado nos leitores Rust
        shell: bash
        env:
          IES_ACERVO_CACHE: ${{ runner.temp }}/ies-acervo-ciencia
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin ies -- --list --ignored |
            grep -F 'ciencia::acervo::replay_da_ciencia_no_acervo: test'
          cargo +1.99.1 test --locked --bin ies ciencia::acervo::replay_da_ciencia_no_acervo -- --ignored --exact --nocapture --test-threads=1
