name: CI

on:
  push:
    branches: [main, "codex/246-documento-criar"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek (Rust, OKF, 20 KB)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy


      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true

      - name: Run canonical prek pre-push gates
        run: uvx --from prek==0.5.7 prek run --hook-stage pre-push --all-files

  replay_documento_criar:
    name: replay GO documento criar (#246, ensaio temporário)
    needs: prek
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Baixar cassette pública conferida (sem SEI)
        run: |
          mkdir -p "$HOME/.cache/ies"
          curl --fail --show-error --silent --location --max-time 240 \
            --output "$HOME/.cache/ies/todos-sei-cassettes-go.zip" \
            https://archive.org/download/todos-sei-cassettes-2026/todos-sei-cassettes-go.zip
          printf '%s  %s\n' \
            42a08cd3714bb863d136ed98e517221510a31982 \
            "$HOME/.cache/ies/todos-sei-cassettes-go.zip" | sha1sum --check
      - name: Replay offline dos leitores reais (nenhuma requisição SEI)
        run: cargo test --locked --bin ies documento_criar::acervo::replay_documento_criar_go -- --ignored --nocapture --test-threads=1
