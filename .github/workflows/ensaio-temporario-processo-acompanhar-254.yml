name: Ensaio temporario #254 (somente SEI UnB treinamento)

on:
  push:
    branches:
      - codex/254-tartaruga-exclusao

permissions:
  contents: read

jobs:
  ensaio:
    name: Previa, uma confirmacao e releitura em UnB (falha fechada)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout sem credenciais persistidas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain Rust fixada
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compilar IES release
        run: cargo build --release --locked --bin ies
      - name: Ensaio unico em ambiente explicitamente de treinamento
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import time

          NUP = "23106.001559/2026-11"
          ORIGEM_EXATA = "https://sei.treinamento.unb.br/sei"
          publico = Path("docs/interfaces/credenciais-de-treinamento.md").read_text()
          registros = [x for x in publico.splitlines() if x.startswith("| `unb` |")]
          if len(registros) != 1:
              raise SystemExit("NOT_RUN: linha oficial de treinamento unica nao encontrada")
          col = [v.strip().strip("\`") for v in registros[0].split("|")[1:-1]]
          if len(col) < 6 or col[2] != ORIGEM_EXATA:
              raise SystemExit("NOT_RUN: origem nao corresponde ao treinamento UnB")
          usuario, senha, orgao = col[3], col[4], col[5]
          if not all((usuario, senha, orgao)):
              raise SystemExit("NOT_RUN: credenciais de treinamento ausentes")
          del publico, registros, col

          def gravar_privado(path, content):
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as fp:
                  fp.write(content)

          def executar(args, env, label):
              try:
                  r = subprocess.run(
                      ["./target/release/ies", "--json", *args],
                      env=env, capture_output=True, text=True,
                      timeout=120, check=False
                  )
              except subprocess.TimeoutExpired:
                  print(f"{label}: FAIL timeout, nenhuma repeticao", flush=True)
                  return 124, {}
              try:
                  v = json.loads(r.stdout)
              except (ValueError, TypeError):
                  print(f"{label}: FAIL saida nao JSON; stderr omitido", flush=True)
                  return r.returncode or 1, {}
              # Campos estritamente publicos: nao imprimir cookie, URL, HTML ou senha.
              campos = (
                  "numero", "unidade", "operacao", "grupo", "ja_estava",
                  "confirmado", "alterado", "id_acompanhamento",
                  "requisicoes", "codigo", "subcodigo", "status_http",
              )
              seguro = {k: v[k] for k in campos if k in v}
              print(f"{label}: rc={r.returncode} {json.dumps(seguro, ensure_ascii=False)}", flush=True)
              return r.returncode, v

          with tempfile.TemporaryDirectory(prefix="ies-254-") as td:
              d = Path(td)
              gravar_privado(d / "origem", ORIGEM_EXATA + "\n")
              gravar_privado(
                  d / "credenciais",
                  f"usuario={usuario}\nsenha={senha}\norgao={orgao}\n"
              )
              del usuario, senha, orgao
              env = os.environ.copy()
              env.pop("IES_CONFIG_FILE", None)
              env.update({
                  "IES_ORIGEM_FILE": str(d / "origem"),
                  "IES_CREDENCIAIS_FILE": str(d / "credenciais"),
                  "IES_COOKIE_FILE": str(d / "cookie"),
                  "IES_URL_CONTROLE_FILE": str(d / "url-controle"),
                  "IES_SEM_INDICE": "1",
              })
              login_rc, login = executar(["login"], env, "LOGIN")
              if login_rc != 0:
                  print("PREVIA/CONFIRMACAO/RELEITURA: NOT_RUN; 0 POST dominio", flush=True)
                  raise SystemExit(0)
              time.sleep(31)
              previa_rc, antes = executar(
                  ["processo", "acompanhar", NUP], env, "PREVIA"
              )
              # Nunca escrever quando a identidade, a oferta ou a ausencia
              # de acompanhamento nao estao comprovadas pela propria CLI.
              seguro = (
                  previa_rc == 0
                  and antes.get("numero") == NUP
                  and antes.get("operacao") == "acompanhar"
                  and antes.get("grupo") == ""
                  and antes.get("ja_estava") is False
                  and antes.get("alterado") is False
                  and antes.get("confirmado") is False
                  and type(antes.get("requisicoes")) is int
                  and 1 <= antes["requisicoes"] <= 12
              )
              if not seguro:
                  print("CONFIRMACAO: NOT_RUN (previa nao autorizou escrita); 0 POST dominio", flush=True)
                  raise SystemExit(0)
              time.sleep(31)
              # UNICA tentativa de confirmar. Nunca repetir POST mesmo com falha.
              confirm_rc, confirmou = executar(
                  ["processo", "acompanhar", NUP, "--confirmar"],
                  env, "UNICO_CONFIRMAR"
              )
              time.sleep(31)
              # Mesmo apos timeout/erro da confirmacao, fazer apenas
              # uma observacao independente por leitura, sem retry de escrita.
              leitura_rc, depois = executar(
                  ["processo", "acompanhar", NUP],
                  env, "VERIFICACAO_SOMENTE_LEITURA"
              )
              aplicado = (
                  confirm_rc == 0
                  and confirmou.get("numero") == NUP
                  and confirmou.get("grupo") == ""
                  and confirmou.get("confirmado") is True
                  and confirmou.get("alterado") is True
                  and leitura_rc == 0
                  and depois.get("numero") == NUP
                  and depois.get("ja_estava") is True
              )
              if aplicado:
                  print(
                      "LIVE PASS: previa -> 1 confirmar -> leitura; "
                      f"residuo=NUP {NUP} grupo vazio, id_observado="
                      f"{confirmou.get('id_acompanhamento')!r}",
                      flush=True,
                  )
              else:
                  print(
                      "LIVE FAIL/INCONCLUSIVO: 1 unico confirmar tentado; "
                      "sem retry. Residuo possivel: verificar somente por leitura.",
                      flush=True,
                  )
                  raise SystemExit(1)
          PY
