name: Ensaio unico #254 (remover workflow apos uso)
on:
  push:
    branches: [codex/254-tartaruga-exclusao]
    paths: [.github/workflows/ensaio254-once.yml]

permissions:
  contents: read

jobs:
  ensaio:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'ci(#254): executar somente um ensaio de treinamento'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 build --release --locked --bin ies
      - name: Prévia → única confirmação → releitura, UnB TREINAMENTO
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile, time
          ORIGEM = 'https://sei.treinamento.unb.br/sei'
          NUP = '23106.001875/2026-93'
          MARCA = 'IES254 Tartaruga 2026-11-06 teste unico'
          guia = pathlib.Path('docs/interfaces/credenciais-de-treinamento.md').read_text()
          prefixo = '| ' + chr(96) + 'unb' + chr(96) + ' |'
          linhas = [l for l in guia.splitlines() if l.startswith(prefixo)]
          if len(linhas) != 1:
              raise SystemExit('NOT_RUN: linha oficial unb nao unica; zero requests')
          cel = [x.strip().strip(chr(96)) for x in linhas[0].split('|')]
          if len(cel) != 9 or cel[3] != ORIGEM or not all(cel[j] for j in (4,5,6)):
              raise SystemExit('NOT_RUN: origem nao autorizada; zero requests')
          pasta = pathlib.Path(tempfile.mkdtemp(prefix='ies254-'))
          pasta.chmod(0o700)
          def privado(nome, conteudo):
              path = pasta / nome
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, 'w', encoding='utf-8') as arq:
                  arq.write(conteudo)
              return str(path)
          env = os.environ.copy()
          env.pop('IES_CONFIG_FILE', None)
          env.update({
              'IES_ORIGEM_FILE': privado('origem', ORIGEM + '\n'),
              'IES_CREDENCIAIS_FILE': privado('credenciais', 'usuario='+cel[4]+'\nsenha='+cel[5]+'\norgao='+cel[6]+'\n'),
              'IES_COOKIE_FILE': privado('cookie', ''),
              'IES_URL_CONTROLE_FILE': privado('controle', ''),
              'IES_INDICE_FILE': str(pasta / 'indice.sqlite3'),
              'XDG_CACHE_HOME': str(pasta / 'cache'),
          })
          binario = str(pathlib.Path('target/release/ies').resolve())
          def chamada(rotulo, args):
              try:
                  saida = subprocess.run([binario, *args, '--json'], env=env, capture_output=True, text=True, timeout=150)
              except subprocess.TimeoutExpired:
                  print(rotulo+': TIMEOUT, se houve POST efeito incerto; NAO repetir')
                  return 124, {}
              try:
                  dados = json.loads(saida.stdout)
                  if not isinstance(dados, dict):
                      dados = {}
              except (ValueError, TypeError):
                  dados = {}
              chaves = ('numero','operacao','grupo','ja_estava','confirmado','alterado','id_acompanhamento','requisicoes','codigo','subcodigo')
              resumo = {k:dados[k] for k in chaves if k in dados}
              print(rotulo+': rc='+str(saida.returncode)+' '+json.dumps(resumo,ensure_ascii=False))
              return saida.returncode, dados
          print('ALVO: UnB exclusivamente de treinamento, NUP conhecido de teste; maximo 1 --confirmar, 0 retry')
          rc, login = chamada('LOGIN', ['login'])
          if rc != 0 or type(login.get('requisicoes')) is not int or not (1 <= login['requisicoes'] <= 10):
              raise SystemExit('NOT_RUN: login nao confirmado; zero POST')
          time.sleep(35)
          args = ['processo','acompanhar',NUP,'--grupo','','--observacao',MARCA]
          rc, previa = chamada('PREVIA', args)
          segura = (
              rc == 0 and previa.get('numero') == NUP
              and previa.get('operacao') == 'acompanhar'
              and previa.get('grupo') == ''
              and previa.get('observacao') == MARCA
              and previa.get('ja_estava') is False
              and previa.get('confirmado') is False
              and previa.get('alterado') is False
              and type(previa.get('requisicoes')) is int
              and 1 <= previa['requisicoes'] <= 8
          )
          if not segura:
              print('NOT_RUN: alvo ja acompanhado, previa incerta ou divergente; zero POST; nao repetir')
              raise SystemExit(1)
          time.sleep(35)
          # ÚNICA escrita possivel; mesmo timeout/rc=3 jamais gera retry.
          rc, confirmado = chamada('CONFIRMACAO_UNICA', [*args,'--confirmar'])
          time.sleep(35)
          rv, verificacao = chamada('LEITURA_INDEPENDENTE', ['processo','acompanhar',NUP,'--grupo',''])
          validado = (
              rc == 0 and confirmado.get('numero') == NUP
              and confirmado.get('operacao') == 'acompanhar'
              and confirmado.get('grupo') == ''
              and confirmado.get('observacao') == MARCA
              and confirmado.get('confirmado') is True
              and confirmado.get('alterado') is True
              and isinstance(confirmado.get('id_acompanhamento'),str)
              and bool(confirmado['id_acompanhamento'])
              and rv == 0 and verificacao.get('numero') == NUP
              and verificacao.get('grupo') == ''
              and verificacao.get('observacao') == MARCA
              and verificacao.get('ja_estava') is True
              and verificacao.get('alterado') is False
          )
          if validado:
              print('LIVE PASS: 1 confirmacao, releitura independente; residuo NUP='+NUP+' id='+confirmado['id_acompanhamento'])
          else:
              print('LIVE FAIL/INCERTO: efeito nao confirmado; verificar por leitura, NAO repetir POST')
              raise SystemExit(1)
          PY
