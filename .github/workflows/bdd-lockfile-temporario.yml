name: BDD lockfile (temporário)

on:
  push:
    branches:
      - codex/bdd-cucumber-cli-20261107

permissions:
  contents: write

jobs:
  atualizar-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Ferramentas Rust do projeto
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Resolver lockfile preservando versões existentes
        run: cargo +1.99.1 metadata --format-version 1 > /dev/null
      - name: Publicar lockfile atualizado
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit -m '🦫 chore: atualizar Cargo.lock para Cucumber'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
