name: Diagnostico temporario da ciencia #271 (somente offline)
on:
  push:
    branches:
      - codex/271-raposa-proc-aviso-confirmacao-20261107
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restaurar ZIPs verificados do gate oficial
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/ies-acervo-ciencia
          key: ies-ciencia-v1-${{ hashFiles('cassettes/**/processo-ciente-*.md', 'cassettes/**/documento-ciente-*.md') }}
      - name: Obter apenas ZIPs publicos verificados (nenhum endpoint SEI)
        env:
          IES_ACERVO_CACHE: ${{ runner.temp }}/ies-acervo-ciencia
        run: python3 scripts/baixar_acervo_ciencia.py
      - name: Classificacao estrutural sanitizada (sem HTML, IDs, URLs, cookies)
        env:
          IES_ACERVO_CACHE: ${{ runner.temp }}/ies-acervo-ciencia
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, zipfile, os, re
          from collections import Counter
          from html.parser import HTMLParser
          from pathlib import Path
          from scripts.baixar_acervo_ciencia import _metadados
          
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.depth = 0
                  self.scripts = []
                  self.current = ""
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      self.depth += 1
                      self.current = ""
              def handle_endtag(self, tag):
                  if tag == "script" and self.depth:
                      self.scripts.append(self.current)
                      self.depth -= 1
              def handle_data(self, data):
                  if self.depth:
                      self.current += data
          
          summaries=[]
          for card in sorted(Path("cassettes").glob("*/*-ciente-*.md")):
              m = _metadados(card)
              zipname = m["source_zip"].split("/")[-1]
              with zipfile.ZipFile(Path(os.environ["IES_ACERVO_CACHE"])/zipname) as z:
                  data=json.loads(z.read(m["archive_member"]))
              for item in data["interactions"]:
                  op=item["request"].get("operation","")
                  if op not in ("procedimento_ciencia", "documento_ciencia"):
                      continue
                  html=base64.b64decode(item["response"].get("body_base64","")).decode("utf8","replace")
                  p=Scripts(); p.feed(html)
                  scripts=p.scripts
                  # Nunca publicar fonte JS, URL, IDs ou valores: somente predicados.
                  id_scripts=[v for v in scripts if "id_atividade=" in v]
                  pistas=[]
                  for js in id_scripts:
                      cut=js.find("id_atividade=")
                      call=js[:cut].rfind("atualizarArvore(")
                      arg=js[call+len("atualizarArvore("):].lstrip() if call>=0 else ""
                      quote=arg[:1] if arg[:1] in ("'", '"') else ""
                      literal=arg[1:].split(quote,1)[0] if quote else ""
                      prefix=js[:call] if call>=0 else ""
                      pistas.append({
                          "call_before_id":call>=0,
                          "arg_quoted":bool(quote),
                          "literal_controlador":literal.startswith("controlador.php?"),
                          "literal_visualizar":"acao=procedimento_visualizar" in literal,
                          "literal_marca_ciencia":"visualizar_ciencias=1" in literal,
                          "literal_com_atividade":"id_atividade=" in literal,
                          "prefix_function_init":"function inicializar()" in prefix,
                          "prefix_if":"if(" in prefix or "if (" in prefix,
                          "prefix_return":"return " in prefix,
                          "prefix_throw":"throw " in prefix,
                          "prefix_has_semicolon":";" in prefix,
                          "script_before_call_bytes":len(prefix),
                "skeleton": [
                    tok if tok in ("function","inicializar","if","return","throw","try","catch","while","for","var","let","const","atualizarArvore") else ("X" if tok[0].isalpha() or tok[0] in "_$" else tok)
                    for tok in re.findall(r"[A-Za-z_$][A-Za-z0-9_$]*|[(){};=]", prefix[max(0,len(prefix)-400):])
                ][-70:]
                      })
                  summaries.append({
                      "site":card.parent.name,
                      "pistas":pistas,
                      "target":"processo" if op == "procedimento_ciencia" else "documento",
                      "scripts":len(scripts),
                      "js_calls":sum(s.count("atualizarArvore(") for s in scripts),
                      "id_script":sum("id_atividade=" in s for s in scripts),
                      "id_body":int("id_atividade=" in html),
                      "init":sum("function inicializar" in s for s in scripts),
                      "visualiza":sum("visualizar_ciencias" in s for s in scripts),
                      "quoted_calls":sum(("atualizarArvore('" in s or 'atualizarArvore("' in s) for s in scripts)
                  })

          for s in summaries:
              print("DIAGNOSTICO_SAFE "+json.dumps(s,sort_keys=True))
          print("TOTAL",len(summaries))
          assert len(summaries)==28
          
          PY
