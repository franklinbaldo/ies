name: 🦫 Ensaio unico #264 (UnB treino, escrita única)

on:
  push:
    branches:
      - codex/264-atribuicao-post-preparado

permissions:
  contents: read

jobs:
  validar:
    if: contains(github.event.head_commit.message, 'ensaio-unico-264')
    runs-on: ubuntu-22.04
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Rust fixado
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Testar fluxo sintético antes de acessar treinamento
        run: |
          cargo +1.99.1 test --locked --test cli_processo_atribuir
          cargo +1.99.1 test --locked --bin ies processo_atribuir::tests_fluxo:: -- --test-threads=1
      - name: Compilar binario do SHA exato
        run: cargo +1.99.1 build --release --locked --bin ies
      - name: Ensaio unico UnB e restauracao comprovada
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time
          from pathlib import Path
          
          BASE = Path(os.environ["RUNNER_TEMP"]) / "castor-264"
          BASE.mkdir(mode=0o700, exist_ok=False)
          os.umask(0o077)
          table = Path("docs/interfaces/credenciais-de-treinamento.md").read_text(encoding="utf-8")
          rows = [l for l in table.splitlines() if l.startswith("| \`unb\` |")]
          if len(rows) != 1:
              raise SystemExit("STOP: fonte de treinamento UnB ausente ou ambígua")
          cells = [v.strip().strip("\`") for v in rows[0].strip().strip("|").split("|")]
          origin, user, password, org = cells[2:6]
          if origin != "https://sei.treinamento.unb.br/sei" or user != "aluno1" or org != "UnB":
              raise SystemExit("STOP: origem ou conta não corresponde a treinamento UnB")
          if not password:
              raise SystemExit("STOP: senha pública de treinamento ausente")
          
          def private_file(name, content):
              p = BASE / name
              fd = os.open(p, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, "w", encoding="utf-8") as f:
                  f.write(content)
              return str(p)
          
          origin_file = private_file("origem", origin + "\n")
          control_file = private_file("controle", "")
          cookie_file = private_file("cookie", "")
          credentials_file = private_file("credenciais", f"usuario={user}\nsenha={password}\norgao={org}\n")
          config_file = str(BASE / "ies.json")
          binary = str(Path("target/release/ies").resolve())
          env = dict(os.environ, IES_CONFIG_FILE=config_file, IES_CREDENCIAIS_FILE=credentials_file,
                     IES_INDICE_FILE=str(BASE / "indice.sqlite3"))
          
          def call(label, *args, json_result=True):
              try:
                  p = subprocess.run([binary, *(["--json"] if json_result else []), *args],
                                     env=env, text=True, capture_output=True, timeout=160, check=False)
              except subprocess.TimeoutExpired:
                  print(f"{label}: TIMEOUT; efeito potencialmente incerto, NUNCA repetir POST", flush=True)
                  raise SystemExit(3)
              data = {}
              if json_result:
                  try:
                      data = json.loads(p.stdout)
                  except (json.JSONDecodeError, TypeError):
                      print(f"{label}: resposta não JSON; stderr oculto", flush=True)
                      raise SystemExit(3)
              print(json.dumps({"etapa": label, "exit": p.returncode,
                                "codigo": data.get("codigo"), "subcodigo": data.get("subcodigo"),
                                "requisicoes": data.get("requisicoes"),
                                "confirmado": data.get("confirmado"),
                                "alterado": data.get("alterado")}, ensure_ascii=False), flush=True)
              if p.returncode:
                  print(f"STOP {label}: nenhuma repetição; se houve POST o resíduo é incerto", flush=True)
                  raise SystemExit(3 if label in ("confirmar_atribuicao", "confirmar_remocao") else 1)
              return data
          
          call("setup", "setup", "--config-file", config_file,
               "--url-controle-file", control_file, "--cookie-file", cookie_file,
               "--origem-file", origin_file)
          call("login", "login")
          time.sleep(35)
          nup = "23106.001559/2026-11"
          preview = call("previa_atribuicao", "processo", "atribuir", nup, "--usuario", "aluno2")
          if preview.get("usuario_atual") != "" or preview.get("usuario_pedido") != "aluno2" or preview.get("confirmado") is not False:
              raise SystemExit("STOP: estado prévio não é desatribuído ou prévia não é inequívoca; 0 POST")
          time.sleep(35)
          confirm = call("confirmar_atribuicao", "processo", "atribuir", nup, "--usuario", "aluno2", "--confirmar")
          if confirm.get("confirmado") is not True or confirm.get("alterado") is not True or confirm.get("usuario_pedido") != "aluno2":
              raise SystemExit("STOP: confirmação não provou atribuição; não repetir, resíduo incerto")
          time.sleep(35)
          preview_remove = call("previa_remocao_independente", "processo", "atribuir", nup, "--remover")
          if preview_remove.get("usuario_atual") != "aluno2" or preview_remove.get("confirmado") is not False:
              raise SystemExit("STOP: releitura independente não confirmou aluno2; não enviar remoção")
          time.sleep(35)
          remove = call("confirmar_remocao", "processo", "atribuir", nup, "--remover", "--confirmar")
          if remove.get("confirmado") is not True or remove.get("alterado") is not True or remove.get("usuario_pedido") is not None:
              raise SystemExit("STOP: remoção não comprovada, não repetir; resíduo incerto")
          time.sleep(35)
          restored = call("verificar_restauracao", "processo", "atribuir", nup, "--usuario", "aluno2")
          if restored.get("usuario_atual") != "" or restored.get("confirmado") is not False:
              raise SystemExit("STOP: estado final não observado como desatribuído; resíduo incerto")
          print("PASS: um POST de atribuição e um POST de remoção; releituras independentes; resíduo final: sem atribuição", flush=True)
          PY
