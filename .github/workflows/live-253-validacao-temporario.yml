name: Validacao live #253 (sem mes, temporaria e unica)
on:
  pull_request:
permissions:
  contents: read
jobs:
  leitura:
    if: github.event.pull_request.head.ref == 'codex/253-unidade-retornos' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/253-unidade-retornos
          persist-credentials: false
      - name: Guard de uma unica rodada, sem retry
        id: guard
        shell: bash
        run: |
          if [ "$(git log -1 --format=%s)" = "live(#253): leitura unica sem mes em PEN3 e GO" ]; then
            echo 'executar=true' >> "$GITHUB_OUTPUT"
          else
            echo 'executar=false' >> "$GITHUB_OUTPUT"
            echo 'NOT_RUN: este commit nao e o ensaio live'
          fi
      - name: Rust fixado
        if: steps.guard.outputs.executar == 'true'
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compilar release
        if: steps.guard.outputs.executar == 'true'
        run: cargo build --locked --release
      - name: Leitura sem mes em treinamento, nao repetir
        if: steps.guard.outputs.executar == 'true'
        shell: bash
        run: |
          set +e
          set -u
          umask 077
          falhas=0
          for inst in pen3 go; do
            echo "INSTALACAO=$inst (TREINAMENTO, somente leitura, sem --mes)"
            D=$(mktemp -d)
            python3 -I - "$inst" "$D" <<'PY'
          import pathlib, sys
          nome, diretorio = sys.argv[1:]
          tabela = pathlib.Path("docs/interfaces/credenciais-de-treinamento.md").read_text()
          achadas = []
          for linha in tabela.splitlines():
              if not linha.startswith("| `"):
                  continue
              campos = [c.strip().strip("`") for c in linha.strip("|").split("|")]
              if campos[0] == nome:
                  achadas.append(campos)
          if len(achadas) != 1 or len(achadas[0]) < 6:
              raise SystemExit("Instalacao nao identificada na fonte publica")
          origem, usuario, senha, orgao = achadas[0][2:6]
          origens = {
              "pen3": "https://sei.orgao3.tramita.processoeletronico.gov.br/sei",
              "go": "https://seitreinamento.go.gov.br/sei",
          }
          if nome not in origens or origem != origens[nome]:
              raise SystemExit("Recusa: origem diferente da instalacao publica de treinamento")
          p = pathlib.Path(diretorio)
          for arquivo, valor in (
              ("origem", origem + "\n"),
              ("credenciais", f"usuario={usuario}\nsenha={senha}\norgao={orgao}\n"),
          ):
              destino = p / arquivo
              destino.write_text(valor)
              destino.chmod(0o600)
          PY
            preparo=$?
            if [ "$preparo" -ne 0 ]; then
              echo "$inst: NOT_RUN — origem/credenciais nao validadas"
              rm -rf "$D"
              exit 1
            fi
            export IES_ORIGEM_FILE="$D/origem" IES_COOKIE_FILE="$D/cookie"
            export IES_URL_CONTROLE_FILE="$D/url-controle" IES_CREDENCIAIS_FILE="$D/credenciais"
            ./target/release/ies --json login > "$D/login.json" 2> "$D/login.err"
            rc=$?
            python3 -I - "$D/login.json" "$inst" "$rc" login <<'PY'
          import json, pathlib, sys
          try:
              o = json.loads(pathlib.Path(sys.argv[1]).read_text())
          except (OSError, ValueError):
              o = {}
          permitidos = ("codigo", "subcodigo", "conexao", "requisicoes", "status_http", "unidade_exibida")
          print(sys.argv[2], sys.argv[4], "saida", sys.argv[3],
                {k: o[k] for k in permitidos if k in o})
          PY
            if [ "$rc" -ne 0 ]; then
              echo "$inst: NOT_RUN leitura (login recusado, sem repetir)"
              bloqueio=$(python3 -I - "$D/login.json" <<'PY'
          import json, pathlib, sys
          try:
              print(json.loads(pathlib.Path(sys.argv[1]).read_text()).get("subcodigo", ""))
          except (OSError, ValueError):
              print("")
          PY
              )
              rm -rf "$D"
              if [ "$bloqueio" = "bloqueio_de_seguranca_da_instalacao" ]; then
                echo "STOP: bloqueio de seguranca, nao consultar outra instalacao"
                exit 0
              fi
              falhas=1
              sleep 65
              continue
            fi
            sleep 65
            ./target/release/ies --json unidade retornos > "$D/retornos.json" 2> "$D/retornos.err"
            rc=$?
            python3 -I - "$D/retornos.json" "$inst" "$rc" retornos <<'PY'
          import json, pathlib, sys
          try:
              o = json.loads(pathlib.Path(sys.argv[1]).read_text())
          except (OSError, ValueError):
              o = {}
          permitidos = ("codigo", "subcodigo", "requisicoes", "status_http",
                        "mes", "total_declarado", "faixa_observada")
          print(sys.argv[2], sys.argv[4], "saida", sys.argv[3],
                {k: o[k] for k in permitidos if k in o})
          PY
            if [ "$rc" -ne 0 ]; then
              falhas=1
            fi
            bloqueio=$(python3 -I - "$D/retornos.json" <<'PY'
          import json, pathlib, sys
          try:
              print(json.loads(pathlib.Path(sys.argv[1]).read_text()).get("subcodigo", ""))
          except (OSError, ValueError):
              print("")
          PY
            )
            rm -rf "$D"
            if [ "$bloqueio" = "bloqueio_de_seguranca_da_instalacao" ]; then
              echo "STOP: bloqueio de seguranca, sem repetir"
              exit 0
            fi
            sleep 65
          done
          exit "$falhas"
