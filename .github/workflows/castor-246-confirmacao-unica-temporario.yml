name: castor-confirmacao-unica-246-temporario
on:
  push:
    branches: [codex/246-castor-preview-treinamento-20261107]
permissions:
  contents: read
jobs:
  treino:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compilar release
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --release --bin ies
      - name: Preparar sessão e arquivos privados somente para UnB treinamento
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          linha=next(s for s in Path("docs/interfaces/credenciais-de-treinamento.md").read_text().splitlines() if s.startswith("| `unb` |"))
          c=[x.strip().strip("`") for x in linha.split("|")[1:-1]]
          origem,usuario,senha,orgao=c[2:6]
          assert origem=="https://sei.treinamento.unb.br/sei", "instalacao nao e treinamento"
          pasta=Path(os.environ["RUNNER_TEMP"])/"castor-246-c"
          pasta.mkdir(mode=0o700,exist_ok=True)
          arquivos={"IES_ORIGEM_FILE":("origem",origem+"\n"),"IES_CREDENCIAIS_FILE":("credenciais",f"usuario={usuario}\nsenha={senha}\norgao={orgao}\n"),"IES_COOKIE_FILE":("cookie",""),"IES_URL_CONTROLE_FILE":("controle","")}
          with open(os.environ["GITHUB_ENV"],"a") as env:
              for chave,(nome,conteudo) in arquivos.items():
                  path=pasta/nome
                  fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600)
                  with os.fdopen(fd,"w") as f:f.write(conteudo)
                  print(f"{chave}={path}",file=env)
              print("IES_SEM_INDICE=1",file=env)
          PY
      - name: Ensaio sequencial — prévia, confirmação no máximo uma, releitura
        shell: bash
        run: |
          set -uo pipefail
          D="$RUNNER_TEMP/castor-246-c"
          B=target/release/ies
          executar() {
            local nome=$1; shift
            set +e
            "$B" --json "$@" > "$D/$nome.json" 2>/dev/null
            local rc=$?
            set -e
            python3 - "$D/$nome.json" "$nome" "$rc" <<'PY'
          import json,sys
          try: d=json.load(open(sys.argv[1]))
          except (OSError,ValueError): d={}
          if isinstance(d,dict):
              chaves=("codigo","subcodigo","requisicoes","numero_sei","confirmado","alterado","tipo","nivel","conexao","status_http")
              saida={k:d.get(k) for k in chaves if k in d}
          else:
              saida={"listas":len(d)} if isinstance(d,list) else {"formato":"nao_json"}
          print(json.dumps({"etapa":sys.argv[2],"exit":int(sys.argv[3]),**saida},ensure_ascii=False))
          PY
            return "$rc"
          }
          executar login login || exit 0
          sleep 35
          executar lista unidade listar-processos || exit 0
          python3 - "$D/lista.json" "$D/selecionado" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.load(open(sys.argv[1]))
          rows=[p for lista in d if isinstance(lista,dict) for p in lista.get("processos",[]) if isinstance(p,dict)] if isinstance(d,list) else []
          proibir={"23106.001868/2026-91","23106.001592/2026-41"}
          candidatos=[str(p.get("numero") or "") for p in rows]
          candidatos=[n for n in candidatos if n and n not in proibir]
          print(json.dumps({"etapa":"selecao","processos_observados":len(rows),"elegiveis":len(candidatos)}))
          if candidatos: Path(sys.argv[2]).write_text(candidatos[0])
          PY
          if ! test -s "$D/selecionado"; then echo "sem processo seguro na unidade; confirmacao NOT_RUN"; exit 0; fi
          NUP=$(cat "$D/selecionado")
          sleep 35
          executar previa documento criar --processo "$NUP" --tipo Despacho --nivel publico || exit 0
          python3 - "$D/previa.json" "$NUP" > "$D/validada" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print("sim" if d.get("tipo")=="Despacho" and d.get("nivel")=="publico" and d.get("confirmado") is False and d.get("alterado") is False and d.get("nup")==sys.argv[2] else "nao")
          PY
          if ! grep -qx 'sim' "$D/validada"; then echo "previa sem identidade garantida; confirmacao NOT_RUN"; exit 0; fi
          sleep 35
          executar foto_antes processo "$NUP" --sem-andamentos --sem-marcadores --sem-propriedades || exit 0
          # Uma chamada de escrita, somente apos previa e foto anterior autenticadas.
          sleep 35
          executar confirmar documento criar --processo "$NUP" --tipo Despacho --nivel publico --confirmar || true
          # Mesmo se o efeito for incerto, apenas leitura posterior; jamais retry.
          sleep 35
          executar foto_depois processo "$NUP" --sem-andamentos --sem-marcadores --sem-propriedades || true
          python3 - "$D" <<'PY'
          import json,sys
          from pathlib import Path
          pasta=Path(sys.argv[1])
          def read(nome):
              try:return json.loads((pasta/(nome+".json")).read_text())
              except (OSError,ValueError): return {}
          antes,depois=read("foto_antes"),read("foto_depois")
          def extrair(obj):
              # Evidencia independente: publicar totais e IDs novos somente se o formato o permitir.
              if not isinstance(obj,dict):return None
              for k in ("documentos","documentos_na_arvore"):
                  xs=obj.get(k)
                  if isinstance(xs,list):
                      return {str(x.get("id") or x.get("id_documento")) for x in xs if isinstance(x,dict)}
              return None
          a,b=extrair(antes),extrair(depois)
          saida={"etapa":"reconciliacao_externa","lista_antes_observada":a is not None,"lista_depois_observada":b is not None}
          if a is not None and b is not None:
              saida.update({"quantidade_antes":len(a),"quantidade_depois":len(b),"novos_ids":len(b-a),"preservados":a.issubset(b)})
          print(json.dumps(saida))
          PY
