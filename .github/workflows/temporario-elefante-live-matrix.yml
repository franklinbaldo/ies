name: "Temporary training SEI connectivity check"
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: read
jobs:
  training-connectivity:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Read-only network check of documented training hosts"
        shell: bash
        run: bash scripts/diagnostico_sei_treinamento.sh
      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build current IES release
        run: cargo +1.99.1 build --release --locked --bin ies
      - name: Live read-only smoke test of public training SEI
        shell: bash
        run: bash scripts/ensaio_live_leitura_treinamento.sh
