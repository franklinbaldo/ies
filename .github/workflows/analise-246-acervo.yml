name: Analise offline de corpus publico para #246
on:
  push:
    branches: [codex/246-raposa-preflight-pen1-20261108]
permissions:
  contents: read
jobs:
  acervo:
    if: "github.event.head_commit.message == '🦊 test: inspecionar formulário do acervo PEN1'"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Conferir cassette pública, só forma estrutural
        run: |
          curl --fail --silent --show-error --location --max-time 180 --retry 0 \
            -o "$RUNNER_TEMP/acervo.zip" \
            https://archive.org/download/todos-sei-cassettes-2026/lotes/lote-0306b45276ae0084.zip
          echo "0306b45276ae0084b78e781051f7ab5fc07e2693  $RUNNER_TEMP/acervo.zip" | sha1sum -c -
          python3 - <<'PY'
          import os,zipfile,hashlib,base64,json,re,html.parser,collections
          with zipfile.ZipFile(os.environ['RUNNER_TEMP']+'/acervo.zip') as z:
              raw=z.read('documento-incluir-pen1.json')
          if hashlib.sha256(raw.replace(b'\r\n',b'\n')).hexdigest()!='3d879b332aac5a834b785b9ff34c296f4af78ab8efce49fae363ee9a010733ba':
              raise SystemExit('Integridade divergente')
          corpus=json.loads(raw)
          assert corpus['schema_version']==1 and corpus['complete'] is True
          class Estrutura(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__();self.nivel=0;self.ancoras=[];self.filtro=[];self.scripts=[]
                  self.dentro_script=False;self.texto_script=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='table' and a.get('id')=='tblSeries': self.nivel+=1
                  if tag=='a':
                      href=a.get('href','');click=a.get('onclick','')
                      acao=re.search(r'(?:\?|&)acao=([a-z_]+)',href)
                      classe='direto:'+acao.group(1) if acao else ('hash' if href=='#' else ('javascript' if href.startswith('javascript:') else 'outro'))
                      metodo=re.match(r'\s*([\w$]+)\(',click)
                      forma=metodo.group(1) if metodo else ('sem_onclick' if not click else 'outro_onclick')
                      if self.nivel: self.ancoras.append((classe,forma))
                      if a.get('id')=='ancExibirSeries':self.filtro.append((classe,forma))
                  if tag=='script' and not a.get('src'):self.dentro_script=True
              def handle_endtag(self,tag):
                  if tag=='table' and self.nivel:self.nivel-=1
                  if tag=='script': self.dentro_script=False
              def handle_data(self,data):
                  if self.dentro_script:self.texto_script.append(data)
          for i,it in enumerate(corpus['interactions']):
              if it['request'].get('operation')!='documento_escolher_tipo' or it['response'].get('status_code')!=200:continue
              raw=base64.b64decode(it['response'].get('body_base64',''))
              body=raw.decode('latin-1',errors='replace')
              e=Estrutura();e.feed(body)
              print('PASSO',i,'BYTES',len(raw),'TBL_SERIES_ANCHORS',len(e.ancoras))
              print('LINK_CLASSES',dict(collections.Counter(e.ancoras)))
              print('EXIBIR_TODOS',e.filtro)
              script='\n'.join(e.texto_script)
              for name in ['escolher','exibirSeries']:
                  m=re.search(r'function\s+'+name+r'\s*\(([^)]*)\)\s*\{',script)
                  print('FUNCAO',name,'presente',bool(m))
                  if m:
                      trecho=script[m.start():m.start()+320]
                      trecho=re.sub(r'(["\x27])([^"\x27]{0,200})\1',
                         lambda z:z.group(1)+(z.group(2) if z.group(2) in
                             {'frmDocumentoEscolherTipo','hdnIdSerie','hdnFiltroSerie'} else '[LIT]')+z.group(1),trecho)
                      trecho=re.sub(r'\b\d{3,}\b','[N]',trecho)
                      trecho=re.sub(r'[a-zA-Z0-9]{36,}','[TOKEN]',trecho)
                      trecho=re.sub(r'https?://[^\s]+','[URL]',trecho)
                      print('PADRAO',name,' '.join(trecho.split())[:300])
          PY
