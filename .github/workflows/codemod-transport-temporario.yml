name: Validar codemod AST transporte (temporario)

on:
  push:
    branches: ["codex/transport-errors-direct-typed"]

permissions:
  contents: read

jobs:
  ast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Codemod Python/Tree-sitter idempotente
        run: |
          uvx --with tree-sitter==0.24.0 --with tree-sitter-rust==0.23.2 python scripts/migrar_falhas_transporte.py --check
          uvx --with tree-sitter==0.24.0 --with tree-sitter-rust==0.23.2 python scripts/migrar_falhas_transporte.py --aplicar
          git diff --exit-code -- src/
