name: CI rapido

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-rapido-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek-rapido:
    name: prek leve (tamanho, Rustfmt, OKF)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: false

      - name: Install pinned Rustfmt
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt

      - name: Run canonical prek pre-commit gates
        run: uvx --from prek==0.5.7 prek run --hook-stage pre-commit --all-files
