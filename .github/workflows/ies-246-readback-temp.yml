name: TEMP #246 UnB — releitura independente sem escrita
on:
  push:
    branches: [codex/246-documento-criar]
    paths: [.github/workflows/ies-246-readback-temp.yml]
permissions:
  contents: read
jobs:
  releitura:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust fixado
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Compilar binario de release
        run: cargo +1.99.1 build --release --locked --bin ies
      - name: Apenas login e leitura em UnB treinamento
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time
          from pathlib import Path

          NUP = "23106.001868/2026-91"
          root = Path("docs/interfaces/credenciais-de-treinamento.md").read_text(encoding="utf8")
          ticks = chr(96)
          section = ticks + "unb" + ticks + ":\n\n" + (ticks * 3) + "text\n"
          if section not in root:
              print(json.dumps({"stage":"setup","status":"FAIL","reason":"credenciais_publicas_ausentes"}))
              raise SystemExit(0)
          credentials = root.split(section, 1)[1].split(ticks * 3, 1)[0]
          if "usuario=aluno1" not in credentials or "orgao=UnB" not in credentials:
              print(json.dumps({"stage":"setup","status":"FAIL","reason":"credenciais_publicas_invalidas"}))
              raise SystemExit(0)

          with tempfile.TemporaryDirectory(prefix="ies246-read-") as td:
              base = Path(td)
              base.chmod(0o700)
              for name, contents in (("origem","https://sei.treinamento.unb.br/sei\n"),("credenciais",credentials),("cookie",""),("controle","")):
                  path = base / name
                  path.write_text(contents, encoding="utf8")
                  path.chmod(0o600)
              env = os.environ.copy()
              env.pop("IES_CONFIG_FILE",None)
              env.pop("IES_SEM_INDICE",None)
              for variable, file in (("IES_ORIGEM_FILE","origem"),("IES_CREDENCIAIS_FILE","credenciais"),("IES_COOKIE_FILE","cookie"),("IES_URL_CONTROLE_FILE","controle")):
                  env[variable] = str(base / file)
              env["IES_INDICE_FILE"] = str(base / "indice.sqlite3")
              env["RUST_LOG"] = "off"

              def invoke(stage,args):
                  try:
                      proc=subprocess.run(["./target/release/ies",*args,"--json"],env=env,check=False,capture_output=True,text=True,timeout=240)
                  except Exception:
                      print(json.dumps({"stage":stage,"status":"FAIL","reason":"timeout_ou_execucao_sem_retry"}),flush=True)
                      return None
                  try:
                      data=json.loads(proc.stdout)
                      if not isinstance(data,dict):data={}
                  except Exception:
                      data={}
                  o={"stage":stage,"status":"PASS" if proc.returncode==0 else "FAIL","exit_code":proc.returncode}
                  if type(data.get("requisicoes")) is int:o["requests"]=data["requisicoes"]
                  sub=data.get("subcodigo")
                  if isinstance(sub,str) and len(sub)<100 and all(c.isalnum() or c=="_" for c in sub):o["subcodigo"]=sub
                  print(json.dumps(o,ensure_ascii=False),flush=True)
                  return proc.returncode,data

              login=invoke("login",["login"])
              if login is None or login[0]!=0:raise SystemExit(0)
              time.sleep(30)
              result=invoke("processo_releitura",["processo",NUP,"--sem-andamentos","--sem-marcadores","--sem-propriedades"])
              if result is None or result[0]!=0:raise SystemExit(0)
              raw=result[1].get("documentos",[])
              docs=[]
              if isinstance(raw,list):
                  for d in raw:
                      if not isinstance(d,dict):continue
                      number=d.get("numero_sei")
                      ident=d.get("id_documento")
                      label=d.get("rotulo")
                      if not isinstance(number,str) or not number.isdecimal() or len(number)>30:continue
                      safe={"numero_sei":number}
                      if isinstance(ident,str) and ident.isdecimal() and len(ident)<30:safe["id_documento"]=ident
                      if isinstance(label,str) and 0<len(label)<90 and all(32<=ord(c)<127 for c in label) and "http" not in label.lower():safe["rotulo"]=label
                      docs.append(safe)
              print(json.dumps({"stage":"documentos_observados","status":"PASS","total":len(docs),"ultimos":docs[-30:]},ensure_ascii=False),flush=True)
          PY
