# Temporário: teste offline dos ZIPs públicos; não acessa nenhuma instalação do SEI.
name: Replay offline processo criar 245 (temporario)
on:
  push:
    branches:
      - codex/245-confirmacao-41-redirecionamento
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Baixar somente sete ZIPs de cassettes públicas verificáveis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ies"
          cd "$RUNNER_TEMP/ies"
          cat > hashes.txt <<'EOF'
          21e0559015c56c403daf8933e5040504a7b83837  todos-sei-cassettes-unb.zip
          3b29ba3c4e18fa0b336fbec9490c4f59a15d4aa0  todos-sei-cassettes-ufrj.zip
          42a08cd3714bb863d136ed98e517221510a31982  todos-sei-cassettes-go.zip
          70841f418106b058c4f81c9b13a1322c51ce8cd0  todos-sei-cassettes-pen1.zip
          32cd3f7feb5a4a80b3b363e9750b9ce0b593d2ff  todos-sei-cassettes-pen2.zip
          b81b84fca29299f2096fb128593ba52f2ac9a7ab  todos-sei-cassettes-pen3.zip
          cd48052869dc64fb12c7179e630f3a23c131cbb0  todos-sei-cassettes-pen4.zip
          EOF
          for nome in unb ufrj go pen1 pen2 pen3 pen4; do
            echo "Baixando cassette publica: $nome"
            curl --fail --location --silent --show-error --connect-timeout 20 --max-time 240 \
              --output "todos-sei-cassettes-$nome.zip" \
              "https://archive.org/download/todos-sei-cassettes-2026/todos-sei-cassettes-$nome.zip"
          done
          sha1sum --check hashes.txt
      - name: Replay do leitor real sem chamada HTTP
        shell: bash
        run: |
          set -euo pipefail
          IES_ACERVO_CACHE="$RUNNER_TEMP/ies" \
          IES_ACERVO_SAIDA="$RUNNER_TEMP/relatorio.md" \
            cargo test --locked --bin ies processo_criar_fluxo::acervo::replay_de_processo_criar_no_acervo -- --ignored --nocapture --test-threads=1
          cat "$RUNNER_TEMP/relatorio.md"
