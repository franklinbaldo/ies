name: Raposa - inspecao temporaria de cassettes BDD-88
on:
  push:
    branches:
      - codex/88-raposa-versao-restrita-20261108
    paths:
      - .github/workflows/raposa-cassettes-temporario.yml

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout sem persistir credenciais
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validar origem, integridade e estrutura sem expor respostas
        run: |
          python3 - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import urlopen
          from zipfile import ZipFile

          cards = [
              "cassettes/unb/liberacoes-e-versoes-leitura-unb--a781b0fbca8f.md",
              "cassettes/pen1/liberacoes-e-versoes-leitura-pen1--f46eada4effb.md",
          ]
          for path in cards:
              raw_card = Path(path).read_text(encoding="utf-8").split("---", 2)[1]
              fields = dict(line.split(": ", 1) for line in raw_card.strip().splitlines() if ": " in line)
              source = fields["source_zip"]
              parsed = urlparse(source)
              assert parsed.scheme == "https" and parsed.netloc == "archive.org"
              assert parsed.path.startswith("/download/todos-sei-cassettes-2026/")
              assert fields["archive_member"].endswith(".json")
              digest = hashlib.sha1()
              from tempfile import TemporaryFile
              with urlopen(source, timeout=150) as response, TemporaryFile() as archive:
                  while chunk := response.read(1024 * 1024):
                      digest.update(chunk)
                      archive.write(chunk)
                  assert digest.hexdigest() == fields["archive_sha1"], "ZIP SHA-1 incorreto"
                  archive.seek(0)
                  with ZipFile(archive) as z:
                      member = z.getinfo(fields["archive_member"])
                      assert member.file_size < 100 * 1024 * 1024
                      cassette_bytes = z.read(member)
              assert hashlib.sha256(cassette_bytes.replace(b"\r\n", b"\n")).hexdigest() == fields["cassette_sha256_lf"], "membro SHA-256 incorreto"
              cassette = json.loads(cassette_bytes)
              assert cassette["schema_version"] == 1 and cassette["complete"] is True
              interactions = cassette["interactions"]
              assert len(interactions) == int(fields["interactions"])
              operations = collections.Counter()
              methods = collections.Counter()
              status_codes = collections.Counter()
              for entry in interactions:
                  request = entry.get("request", {})
                  if not isinstance(request, dict):
                      continue
                  method = str(request.get("method", "?")).upper()
                  operation = request.get("operation") or request.get("action") or "nao_extraida"
                  if not isinstance(operation, str) or not operation.replace("_", "").isalnum():
                      operation = "nao_extraida"
                  methods[method] += 1
                  operations[(method, operation)] += 1
                  response = entry.get("response", {})
                  if isinstance(response, dict):
                      status = response.get("status") or response.get("status_code")
                      if isinstance(status, int) and 100 <= status <= 599:
                          status_codes[status] += 1
              print("CASSETTE_OK", fields["installation"], len(interactions))
              print("METHODS", sorted(methods.items()))
              print("VERSION_ACTIONS", sorted((method, action, count) for (method, action), count in operations.items() if action in ("documento_versao_listar", "documento_visualizar")))
              print("STATUS_CODES", sorted(status_codes.items()))
          print("INSPECAO_OK; sem log de respostas, cookies, URLs ou dados pessoais")
          PY
