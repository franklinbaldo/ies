name: castor-leitura-residuo-246-temporario
on:
  push:
    branches: [codex/246-castor-preview-treinamento-20261107]
permissions:
  contents: read
jobs:
  ler:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compilar release
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --release --locked --bin ies
      - name: Configurar somente UnB treinamento com arquivos privados
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          c=[v.strip().strip("`") for v in next(x for x in Path("docs/interfaces/credenciais-de-treinamento.md").read_text().splitlines() if x.startswith("| `unb` |")).split("|")[1:-1]]
          origem,usuario,senha,orgao=c[2:6]
          assert origem=="https://sei.treinamento.unb.br/sei"
          d=Path(os.environ["RUNNER_TEMP"])/"castor-246-leitura";d.mkdir(mode=0o700,exist_ok=True)
          fs={"IES_ORIGEM_FILE":("origem",origem+"\n"),"IES_CREDENCIAIS_FILE":("credenciais",f"usuario={usuario}\nsenha={senha}\norgao={orgao}\n"),"IES_COOKIE_FILE":("cookie",""),"IES_URL_CONTROLE_FILE":("controle","")}
          with open(os.environ["GITHUB_ENV"],"a") as env:
              for k,(nome,v) in fs.items():
                  path=d/nome
                  fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_TRUNC,0o600)
                  with os.fdopen(fd,"w") as f:f.write(v)
                  print(f"{k}={path}",file=env)
              print("IES_SEM_INDICE=1",file=env)
          PY
      - name: Login e leitura somente de documento 0012225
        shell: bash
        run: |
          set -uo pipefail
          D="$RUNNER_TEMP/castor-246-leitura"
          set +e
          target/release/ies --json login > "$D/login.json" 2>/dev/null
          rc=$?
          set -e
          python3 - "$D/login.json" "$rc" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1]))
          except (OSError,ValueError):d={}
          print(json.dumps({"etapa":"login","exit":int(sys.argv[2]),"requisicoes":d.get("requisicoes"),"subcodigo":d.get("subcodigo")}))
          PY
          test "$rc" -eq 0
          sleep 35
          set +e
          target/release/ies --json documento 0012225 > "$D/documento.json" 2>/dev/null
          rc=$?
          set -e
          python3 - "$D/documento.json" "$rc" <<'PY'
          import json,sys
          try:d=json.load(open(sys.argv[1]))
          except (OSError,ValueError):d={}
          docs=d.get("documentos",[]) if isinstance(d,dict) else []
          encontrados=[x for x in docs if isinstance(x,dict) and x.get("numero")=="0012225"]
          v=encontrados[0] if encontrados else {}
          p=v.get("processo") if isinstance(v.get("processo"),dict) else {}
          print(json.dumps({"etapa":"leitura_residuo","exit":int(sys.argv[2]),"subcodigo":d.get("subcodigo"),"requisicoes":d.get("requisicoes"),"documentos":len(docs),"numero":v.get("numero"),"id_documento":v.get("id_documento"),"nup":p.get("nup"),"id_processo":p.get("id"),"tipo":v.get("tipo")}))
          PY
