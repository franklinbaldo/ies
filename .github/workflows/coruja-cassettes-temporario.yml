name: Coruja inspecao temporaria de cassettes de envio
on:
  push:
    branches:
      - codex/333-coruja-anotacao-fechada-20261108
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir hashes e resumir somente metodos e acoes
        env:
          CASSETTE_CARDS: 'cassettes/ufrj/processo-escritas-ufrj--d21a20db9b10.md cassettes/unb/processo-enviar-retorno-unb--326217a6e111.md'
        run: python3 scripts/inspecionar_cassettes.py
