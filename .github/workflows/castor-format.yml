name: Castor rustfmt temporario
on:
  pull_request:
    paths:
      - '.github/workflows/castor-format.yml'
      - 'tests/aies_anexacao_cli.rs'
      - 'src/processo_anexar/**'
      - 'src/processo_anexar_cli.rs'
      - 'crates/anti-ies/**'
      - 'crates/iesei/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formatar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: cargo +1.99.1 fmt --all
      - name: Exportar somente fontes formatadas para revisao
        run: |
          python3 - <<'PY'
          import base64
          import pathlib
          import subprocess
          for nome in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines():
              if not nome.endswith('.rs'):
                  continue
              conteudo = pathlib.Path(nome).read_bytes()
              print('CASTOR_RUSTFMT::'+nome+'::'+base64.b64encode(conteudo).decode('ascii'))
          PY
