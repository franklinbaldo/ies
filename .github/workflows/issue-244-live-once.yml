name: Temporario 244 LIVE UnB GO leitura unica

on:
  push:
    branches:
      - codex/244-unidades-indice-local

permissions:
  contents: read

jobs:
  treinamento:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compilar IES
        run: cargo +1.99.1 build --release --locked --bin ies
      - name: Ensaio de leitura UnB e GO sem retry
        env:
          RUST_BACKTRACE: "0"
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile, time
          doc = pathlib.Path("docs/interfaces/credenciais-de-treinamento.md").read_text()
          def entrada(chave):
              rows = [r for r in doc.splitlines() if r.startswith("| "+chr(96)+chave+chr(96)+" |")]
              if len(rows) != 1:
                  raise RuntimeError("instalacao sem linha unica na lista publica")
              cols = [x.strip() for x in rows[0].split("|")]
              return cols[3].strip(chr(96)), cols[4].strip(chr(96)), cols[5].strip(chr(96)), cols[6].strip(chr(96))
          def privado(path, dado):
              path.write_text(dado)
              path.chmod(0o600)
          def executar(args, env, limite):
              try:
                  p = subprocess.run(["target/release/ies", "--json", *args], env=env,
                      capture_output=True, text=True, timeout=limite, check=False)
              except subprocess.TimeoutExpired:
                  return {"resultado":"FAIL", "motivo":"timeout_do_comando"}
              try:
                  payload = json.loads(p.stdout)
              except (ValueError, TypeError):
                  payload = {}
              if p.returncode != 0:
                  return {"resultado":"FAIL", "codigo_saida":p.returncode,
                      "subcodigo":payload.get("subcodigo", "nao_observado"),
                      "status_http":payload.get("status_http"),
                      "requisicoes":payload.get("requisicoes")}
              return {"resultado":"PASS", "requisicoes":payload.get("requisicoes"),
                  "total":payload.get("total"), "origem":payload.get("origem"),
                  "persistida_no_indice":payload.get("persistida_no_indice")}
          for indice, chave in enumerate(("unb", "go")):
              if indice:
                  time.sleep(45)
              try:
                  origem, usuario, senha, orgao = entrada(chave)
                  diretorio = pathlib.Path(tempfile.mkdtemp(prefix="ies-244-"))
                  diretorio.chmod(0o700)
                  env = os.environ.copy()
                  env.pop("IES_CONFIG_FILE", None)
                  env.pop("IES_SEM_INDICE", None)
                  for nome, dado in (
                      ("IES_ORIGEM_FILE", origem),
                      ("IES_URL_CONTROLE_FILE", ""),
                      ("IES_COOKIE_FILE", ""),
                      ("IES_CREDENCIAIS_FILE", "usuario="+usuario+"\nsenha="+senha+"\norgao="+orgao+"\n"),
                  ):
                      caminho = diretorio / nome.lower()
                      privado(caminho, dado)
                      env[nome] = str(caminho)
                  login = executar(["login"], env, 180)
                  print(json.dumps({"instalacao":chave,"etapa":"login",**login}))
                  if login["resultado"] != "PASS":
                      continue
                  time.sleep(30)
                  leitura = executar(["unidade", "listar", "--atualizar"], env, 420)
                  print(json.dumps({"instalacao":chave,"etapa":"listar_atualizar",**leitura}))
                  if leitura["resultado"] != "PASS":
                      continue
                  time.sleep(30)
                  pesquisa = executar(["unidade", "pesquisar", "SE"], env, 150)
                  print(json.dumps({"instalacao":chave,"etapa":"pesquisar",**pesquisa}))
              except Exception as erro:
                  print(json.dumps({"instalacao":chave, "etapa":"preparacao",
                      "resultado":"FAIL", "tipo":type(erro).__name__}))
          PY
