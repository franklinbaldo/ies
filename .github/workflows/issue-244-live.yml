name: Temporario issue 244 ensaio somente leitura UnB GO

on:
  push:
    branches: [codex/244-unidades-indice-local]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        instalacao: [unb, go]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      IES_CASO: ${{ matrix.instalacao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 build --release --locked --bin ies
      - name: Executar uma vez cada consulta de treinamento e publicar somente contagens
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PRIVATE="$RUNNER_TEMP/ies-live-${IES_CASO}"
          mkdir -p "$PRIVATE"
          chmod 700 "$PRIVATE"
          export PRIVATE
          python3 - <<'PY'
          from pathlib import Path
          import os
          key = os.environ["IES_CASO"]
          content = Path("docs/interfaces/credenciais-de-treinamento.md").read_text()
          rows = [row for row in content.splitlines() if row.startswith("| `" + key + "` |")]
          if len(rows) != 1:
              raise SystemExit("instalacao nao documentada de forma unica")
          cols = [col.strip().strip("`") for col in rows[0].split("|")[1:-1]]
          origem, usuario, senha, orgao = cols[2:6]
          path = Path(os.environ["PRIVATE"])
          contents = {
              "origem": origem + "\n",
              "url": "",
              "cookie": "",
              "credenciais": f"usuario={usuario}\nsenha={senha}\norgao={orgao}\n",
          }
          for nome, texto in contents.items():
              destino = path / nome
              destino.write_text(texto)
              destino.chmod(0o600)
          PY
          export IES_ORIGEM_FILE="$PRIVATE/origem"
          export IES_URL_CONTROLE_FILE="$PRIVATE/url"
          export IES_COOKIE_FILE="$PRIVATE/cookie"
          export IES_CREDENCIAIS_FILE="$PRIVATE/credenciais"
          export IES_INDICE_FILE="$PRIVATE/ies.sqlite3"
          resumo() {
            python3 - "$1" "$2" <<'PY'
          import json,sys
          from pathlib import Path
          name,path=sys.argv[1:]
          try:
              obj=json.loads(Path(path).read_text())
          except Exception:
              print(name + ": FAIL (saida nao JSON, omitida)")
              raise SystemExit
          keys=["codigo","subcodigo","status_http","origem","total","requisicoes","persistida_no_indice","conexao","unidade_exibida"]
          print(name + ": " + json.dumps({k:obj[k] for k in keys if k in obj},ensure_ascii=False))
          PY
          }
          if ./target/release/ies login --json >"$PRIVATE/login.json" 2>"$PRIVATE/login.err"; then
            resumo "LOGIN" "$PRIVATE/login.json"
          else
            resumo "LOGIN FAIL" "$PRIVATE/login.json"
            exit 1
          fi
          sleep 30
          if ./target/release/ies unidade listar --atualizar --json >"$PRIVATE/listar.json" 2>"$PRIVATE/listar.err"; then
            resumo "LISTAR ATUALIZAR" "$PRIVATE/listar.json"
          else
            resumo "LISTAR FAIL" "$PRIVATE/listar.json"
            exit 1
          fi
          sleep 30
          if ./target/release/ies unidade pesquisar "A" --json >"$PRIVATE/pesquisar.json" 2>"$PRIVATE/pesquisar.err"; then
            resumo "PESQUISAR" "$PRIVATE/pesquisar.json"
          else
            resumo "PESQUISAR FAIL" "$PRIVATE/pesquisar.json"
            exit 1
          fi
          echo "Consulta finalizada; nenhuma escrita remota; 0 retries."
