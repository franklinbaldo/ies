# TEMPORÁRIO #264: apenas prévia de remoção na instalação GO de TREINAMENTO.
# Sem --confirmar, sem escrita de atribuição. Remover após o ensaio.
name: ensaio temporario #264 GO
on:
  push:
    branches: [codex/264-atribuicao-post-preparado]
permissions:
  contents: read
jobs:
  previa_go:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Rust fixado
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compilar ies
        run: cargo +1.99.1 build --release --locked --bin ies
      - name: Login e prévia única em GO (sem confirmação)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          localdir="$RUNNER_TEMP/ies264go"
          mkdir -p "$localdir"
          chmod 700 "$localdir"
          python3 - "$localdir" <<'PY'
          import os
          from pathlib import Path
          import sys
          dest = Path(sys.argv[1])
          rows = Path("docs/interfaces/credenciais-de-treinamento.md").read_text().splitlines()
          row = next(line for line in rows if line.startswith("| `go` |"))
          cells = [c.strip().strip("`") for c in row.strip("|").split("|")]
          origin, user, password, org = cells[2], cells[3], cells[4], cells[5]
          if origin != "https://seitreinamento.go.gov.br/sei":
              raise SystemExit("origem de treinamento diferente da esperada")
          for name, value in (("origem", origin + "\n"), ("cred", f"usuario={user}\nsenha={password}\norgao={org}\n"), ("cookie", ""), ("controle", "")):
              fd = os.open(dest / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, "w") as file:
                  file.write(value)
          PY
          export IES_ORIGEM_FILE="$localdir/origem"
          export IES_CREDENCIAIS_FILE="$localdir/cred"
          export IES_COOKIE_FILE="$localdir/cookie"
          export IES_URL_CONTROLE_FILE="$localdir/controle"
          export IES_SEM_INDICE=1
          set +e
          ./target/release/ies --json login >"$localdir/login.out" 2>"$localdir/login.err"
          login_rc=$?
          set -e
          python3 - "$localdir/login.out" "$login_rc" <<'PY'
          import json,sys
          try:
              data = json.load(open(sys.argv[1]))
          except (ValueError,OSError):
              data = {}
          print(json.dumps({"etapa":"login_go","saida":int(sys.argv[2]),"subcodigo":data.get("subcodigo"),"requisicoes":data.get("requisicoes")},ensure_ascii=False))
          PY
          if [ "$login_rc" -ne 0 ]; then exit 0; fi
          # Ritmo seguro já observado em GO: >=90s entre comandos (WAF).
          sleep 95
          set +e
          ./target/release/ies --json processo atribuir "202400013000003" --remover >"$localdir/previa.out" 2>"$localdir/previa.err"
          previa_rc=$?
          set -e
          python3 - "$localdir/previa.out" "$previa_rc" <<'PY'
          import json,sys
          try:
              data=json.load(open(sys.argv[1]))
          except (ValueError,OSError):
              data={}
          print(json.dumps({"etapa":"previa_go_remover","saida":int(sys.argv[2]),"subcodigo":data.get("subcodigo"),"unidade":data.get("unidade"),"aberto_em":data.get("aberto_em"),"motivo":data.get("motivo"),"requisicoes":data.get("requisicoes"),"confirmado":data.get("confirmado"),"alterado":data.get("alterado"),"sem_post_atribuicao":True},ensure_ascii=False))
          PY
          # Sem --confirmar, POST de atribuição e retry.
