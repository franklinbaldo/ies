name: Polvo - sincronizar PR 458 com main (temporario)

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/polvo-sync-main-temp.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  sincronizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mesclar main por API GitHub, sem rebase ou force-push
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_ESPERADO: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/458/update-branch" \
            -f expected_head_sha="${SHA_ESPERADO}"
      - name: Listar nomes das memorias recentes (sem conteudo privado)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Relacionar memorias existentes
        run: |
          if test -d team/memories/polvo; then
            find team/memories/polvo -maxdepth 1 -type f -name '*.md' | sort -r | head -n 5
          fi
