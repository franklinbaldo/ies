name: Polvo - conciliar main depois da PR 459 (temporario)

on:
  push:
    branches:
      - codex/polvo-89-editor-antiies-20261108
    paths:
      - '.github/workflows/polvo-merge-temp.yml'

permissions:
  contents: write

jobs:
  conciliar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout completo da branch autoral
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/polvo-89-editor-antiies-20261108
          fetch-depth: 0
          persist-credentials: true
      - name: Merge verdadeiro com resolucao restrita aos cinco conflitos identificados
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'polvo-bot'
          git config user.email 'polvo-bot@users.noreply.github.com'
          git fetch origin main
          if git merge --no-ff --no-commit origin/main; then
            echo "Merge automatico sem conflitos; continuar apenas com revisao da versao SQL"
            exit 1
          fi
          python3 scripts/polvo-resolver-merge-temp.py
          git rm -f .github/workflows/polvo-merge-temp.yml scripts/polvo-resolver-merge-temp.py .github/polvo-merge-conflitos.txt
          git add -A
          git diff --cached --check
          git commit -m '🐙 merge: conciliar editor SQL v11 e estados da PR 459'
          git push origin HEAD:refs/heads/codex/polvo-89-editor-antiies-20261108
          echo "CONCILIACAO_CONCLUIDA"
