name: Polvo - merge main e conciliacao (temporario)

on:
  push:
    branches:
      - codex/polvo-89-editor-antiies-20261108
    paths:
      - '.github/workflows/polvo-merge-temp.yml'

permissions:
  contents: write

jobs:
  mesclar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout da branch autoral
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/polvo-89-editor-antiies-20261108
          fetch-depth: 0
          persist-credentials: true
      - name: Mesclar main e listar conflitos sem publicar estado parcial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'polvo-bot'
          git config user.email 'polvo-bot@users.noreply.github.com'
          git fetch origin main
          if git merge --no-ff --no-commit origin/main; then
            git rm -f .github/workflows/polvo-merge-temp.yml
            git commit -m '🐙 merge: conciliar main atual com editor #89'
            git push origin HEAD:refs/heads/codex/polvo-89-editor-antiies-20261108
            echo 'MERGE_PUSH_OK'
          else
            echo 'CONFLITOS_DETECTADOS'
            git status --short
            git diff --name-only --diff-filter=U
            git diff --name-only --diff-filter=U > /tmp/polvo-conflitos
            git merge --abort
            cp /tmp/polvo-conflitos .github/polvo-merge-conflitos.txt
            git add .github/polvo-merge-conflitos.txt
            git commit -m '🐙 docs: registrar lista exata de conflitos do merge #459'
            git push origin HEAD:refs/heads/codex/polvo-89-editor-antiies-20261108
            echo 'CONFLITOS_REGISTRADOS'
          fi
