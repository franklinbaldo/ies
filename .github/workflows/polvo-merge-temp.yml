name: Polvo - merge main e conciliacao (temporario)

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/polvo-merge-temp.yml'

permissions:
  contents: write

jobs:
  mesclar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout da branch autoral
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Mesclar main e listar conflitos sem publicar estado parcial
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'polvo-bot'
          git config user.email 'polvo-bot@users.noreply.github.com'
          git fetch origin main
          if git merge --no-ff --no-commit origin/main; then
            git rm -f .github/workflows/polvo-merge-temp.yml
            git commit -m '🐙 merge: conciliar main atual com editor #89'
            git push origin HEAD:refs/heads/codex/polvo-89-editor-antiies-20261108
            echo 'MERGE_PUSH_OK'
          else
            echo 'CONFLITOS_DETECTADOS'
            git status --short
            git diff --name-only --diff-filter=U
            echo 'FIM_CONFLITOS'
            exit 1
          fi
