name: Replay temporário da ciência #271 (sem SEI)
on:
  push:
    branches: [codex/271-raposa-noscript-repetida]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IES_ACERVO_CACHE: ${{ runner.temp }}/ies-acervo-ciencia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Rust fixado
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache compilation
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Baixar ZIPs de cassettes públicas e conferir hashes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import urlopen
          from hashlib import sha1
          import os, shutil
          cards=sorted(Path('cassettes').glob('*/*-ciente-*.md'))
          assert len(cards)==14, f'cards: {len(cards)}'
          cache=Path(os.environ['IES_ACERVO_CACHE'])
          cache.mkdir(parents=True,exist_ok=True)
          zips={}
          for card in cards:
              lines=card.read_text(encoding='utf-8').splitlines()
              meta=dict(line.split(': ',1) for line in lines if line.startswith(('source_zip: ','archive_sha1: ')))
              url,digest=meta['source_zip'],meta['archive_sha1']
              name=Path(urlparse(url).path).name
              if name in zips:
                  assert zips[name]==digest, f'hash divergente: {name}'
                  continue
              zips[name]=digest
              target=cache/name
              if not target.exists() or sha1(target.read_bytes()).hexdigest()!=digest:
                  with urlopen(url,timeout=300) as source,target.open('wb') as out:
                      shutil.copyfileobj(source,out)
              actual=sha1(target.read_bytes()).hexdigest()
              assert actual==digest, f'SHA-1 divergente: {name}'
              print(f'OK SHA-1 {name}')
          print(f'{len(cards)} cards, {len(zips)} ZIPs íntegros')
          PY
      - name: Replay obrigatório dos leitores Rust de ciência
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin ies ciencia::acervo::replay_da_ciencia_no_acervo -- --ignored --exact --nocapture --test-threads=1
