name: Replay manual #253 (temporario)
on:
  push:
    branches: [codex/253-unidade-retornos]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.1
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Obter cassettes publicas, sem retry e conferir SHA-1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/ies"
          while read -r digest path; do
            destino="$HOME/.cache/ies/${path##*/}"
            curl --fail --silent --show-error --location --retry 0 --max-time 300 \
              "https://archive.org/download/todos-sei-cassettes-2026/$path" -o "$destino"
            echo "$digest  $destino" | sha1sum --check
          done <<'ZIPS'
          21e0559015c56c403daf8933e5040504a7b83837 todos-sei-cassettes-unb.zip
          c7a4af8d9d70ddc3599cdd9bccbb98e6d726db78 lotes/lote-c7a4af8d9d70ddc3.zip
          7e4954690958f7a73caf0534d0c05f32e891dde9 lotes/lote-7e4954690958f7a7.zip
          28a245e07bf7d358a322981744dc5e79a835ba94 lotes/lote-28a245e07bf7d358.zip
          15a748cdb7c0fdbd907c8b3b922fa0194ae8887c lotes/lote-15a748cdb7c0fdbd.zip
          1e2f128fe845906a364058f0d5eb22a0308b4095 lotes/lote-1e2f128fe845906a.zip
          ZIPS
      - name: Replay de retornos contra o acervo verificado
        run: scripts/replay replay_retornos_no_acervo
