id: 10-causa-descartada
message: 'A causa descartada vira a fonte da variante: map_err(|_| E::V) -> map_err(E::V).'
language: rust
severity: hint
rule:
  pattern: '$R.map_err(|_| $V)'
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        kind: attribute_item
        regex: 'cfg\((all\()?test\b'
constraints:
  V:
    kind: scoped_identifier
fix: '$R.map_err($V)'
---
