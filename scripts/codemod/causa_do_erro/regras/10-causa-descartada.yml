---
id: 11-causa-nomeada-sem-uso
message: 'A causa nomeada e não usada (|_e|, |_: T|, |StructUnitaria|) vira a fonte da variante: map_err(E::V).'
language: rust
severity: hint
rule:
  pattern: '$R.map_err(|$P| $V)'
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        kind: attribute_item
        regex: 'cfg\((all\()?test\b'
constraints:
  P:
    regex: '^(_[A-Za-z0-9_]*(\s*:\s*[A-Za-z0-9_:<>]+)?|[A-Z][A-Za-z0-9_]*)$'
  V:
    kind: scoped_identifier
fix: '$R.map_err($V)'
