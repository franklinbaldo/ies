id: funcoes-com-parser
language: rust
rule:
  kind: function_item
  has:
    field: name
    pattern: $F
  all:
    - has:
        field: parameters
        has:
          any:
            - pattern:
                context: "fn f($P: &tl::Parser<$L>) {}"
                selector: parameter
            - all:
                - kind: parameter
                - has:
                    field: type
                    regex: "^&'[a-z_]+ tl::Parser<"
