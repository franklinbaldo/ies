id: 52a-as-tag-let-else
language: rust
message: 'let Some(x) = n.as_tag() else {…}: o nó já é o elemento (o let)'
severity: hint
rule:
  all:
    - pattern: 'let Some($X) = $H.as_tag() else { $$$B };'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  H:
    kind: identifier
fix: '/* ies-codemod: remover linha */'
