id: 31-atributo-emprestado
language: rust
message: 'Valor de atributo usado só por as_deref(), is_some_and ou is_none_or: sem to_owned'
severity: hint
rule:
  all:
    - pattern: 'let $V = $T.atributo($K).map(str::to_owned);'
    - not:
        precedes:
          stopBy: end
          has:
            stopBy: end
            all:
              - kind: identifier
              - pattern: $V
              - not:
                  inside:
                    stopBy: end
                    any:
                      - pattern: $V.as_deref()
                      - pattern: $V.is_some_and($F)
                      - pattern: $V.is_none_or($F)
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: 'let $V = $T.atributo($K);'
