id: 11e-decodificado-let-usos
language: rust
message: 'let y = decodificar_atributo(&b) de valor já decodificado: os usos de y viram b'
severity: hint
rule:
  all:
    - kind: identifier
    - pattern: $Y
    - inside:
        stopBy: end
        follows:
          stopBy: end
          any:
            - pattern: 'let $Y = decodificar_atributo(&$B);'
            - pattern: 'let $Y = crate::formulario_web::decodificar_atributo(&$B);'
    - not:
        pattern: $B
    - inside:
        stopBy: end
        follows:
          stopBy: end
          kind: let_declaration
          all:
            - has:
                field: pattern
                any:
                  - pattern: $B
                  - has:
                      stopBy: end
                      pattern: $B
            - has:
                field: value
                stopBy: end
                any:
                  - pattern: $T.atributo($K)
                  - pattern: $T.texto()
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  B:
    kind: identifier
fix: '$B'
