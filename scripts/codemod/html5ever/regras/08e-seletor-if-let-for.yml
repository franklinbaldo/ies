id: 08e-seletor-if-let-for
language: rust
message: 'if let Some(l) = t.query_selector(p, nome) { for x in l {…} }: o for direto'
severity: hint
rule:
  all:
    - pattern: 'if let Some($L) = $T.query_selector($P, $S) { for $X in $L { $$$B } }'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  S:
    regex: '^"[a-z][a-z0-9]*"$'
fix: |-
  for $X in $T.elementos($S) {
      $$$B
  }
