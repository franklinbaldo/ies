id: 12c-presente-expect
language: rust
message: 'atributo_presente(t, k).expect(m)/.unwrap()'
severity: hint
rule:
  all:
    - any:
        - pattern: 'atributo_presente($T, $K).expect($M)'
        - pattern: 'crate::html_atributos::atributo_presente($T, $K).expect($M)'
        - pattern: 'atributo_presente($T, $K).unwrap()'
        - pattern: 'crate::html_atributos::atributo_presente($T, $K).unwrap()'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: '$T.presente($K)'
