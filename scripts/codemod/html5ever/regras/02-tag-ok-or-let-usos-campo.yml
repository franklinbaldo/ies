id: 02-tag-ok-or-let-usos-campo
language: rust
message: 'let de um handle resolvido com ok_or: o nome some e os usos passam ao handle (usos) (campo abreviado de struct)'
severity: hint
rule:
  all:
    - kind: identifier
    - pattern: $X
    - inside:
        stopBy: end
        follows:
          stopBy: end
          pattern: 'let $X = $H.get($P).and_then(tl::Node::as_tag).$M($E)?;'
    - not:
        pattern: $H
    - inside:
        kind: shorthand_field_initializer
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  M:
    regex: '^ok_or(_else)?$'
  H:
    kind: identifier
fix: '$X: $H'
