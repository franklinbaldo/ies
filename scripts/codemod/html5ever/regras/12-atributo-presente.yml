id: 12-atributo-presente
language: rust
message: 'Atributo booleano.'
severity: hint
rule:
  any:
    - pattern: atributo_presente($T, $K).map_err($E)?
    - pattern: atributo_presente($T, $K)?
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
fix: '$T.presente($K)'
