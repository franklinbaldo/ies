id: 52-as-tag-let-else-usos
language: rust
message: 'let Some(x) = n.as_tag() else {…}: o nó já é o elemento (usos)'
severity: hint
rule:
  all:
    - kind: identifier
    - pattern: $X
    - inside:
        stopBy: end
        follows:
          stopBy: end
          pattern: 'let Some($X) = $H.as_tag() else { $$$B };'
    - not:
        pattern: $H
    - not:
        inside:
          kind: shorthand_field_initializer
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  H:
    kind: identifier
fix: '$H'
