id: 07a2-no-interrogacao-let-usos-campo
language: rust
message: 'let x = h.get(parser)?: o nó sempre existe (usos) (campo abreviado de struct)'
severity: hint
rule:
  all:
    - kind: identifier
    - pattern: $X
    - inside:
        stopBy: end
        follows:
          stopBy: end
          any:
            - pattern: 'let $X = $H.get($P)?;'
    - not:
        pattern: $H
    - inside:
        kind: shorthand_field_initializer
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  H:
    kind: identifier
  P:
    regex: '^(parser|.*\.parser\(\))$'
fix: '$X: $H'
