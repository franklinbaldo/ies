id: 50-as-tag-ok-or-let-usos
language: rust
message: 'let x = n.as_tag().ok_or(e)? ou n.as_tag()?: o nó já é o elemento (usos)'
severity: hint
rule:
  all:
    - kind: identifier
    - pattern: $X
    - inside:
        stopBy: end
        follows:
          stopBy: end
          any:
            - pattern: 'let $X = $H.as_tag().$M($E)?;'
            - pattern: 'let $X = $H.as_tag()?;'
    - not:
        pattern: $H
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  H:
    kind: identifier
  M:
    regex: '^ok_or(_else)?$'
fix: '$H'
