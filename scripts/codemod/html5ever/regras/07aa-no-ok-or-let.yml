id: 07aa-no-ok-or-let
language: rust
message: 'let x = h.get(parser).ok_or(e)?: o nó sempre existe (o let)'
severity: hint
rule:
  all:
    - any:
        - pattern: 'let $X = $H.get($P).$M($E)?;'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  H:
    kind: identifier
  P:
    regex: '^(parser|.*\.parser\(\))$'
  M:
    regex: '^ok_or(_else)?$'
fix: '/* ies-codemod: remover linha */'
