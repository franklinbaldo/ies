id: 50a-as-tag-ok-or-let
language: rust
message: 'let x = n.as_tag().ok_or(e)? ou n.as_tag()?: o nó já é o elemento (o let)'
severity: hint
rule:
  all:
    - any:
        - pattern: 'let $X = $H.as_tag().$M($E)?;'
        - pattern: 'let $X = $H.as_tag()?;'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  H:
    kind: identifier
  M:
    regex: '^ok_or(_else)?$'
fix: '/* ies-codemod: remover linha */'
