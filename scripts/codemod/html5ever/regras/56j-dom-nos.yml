id: 56j-dom-nos
language: rust
message: 'dom.children() (primeiro nível do trecho) vira nos()'
severity: hint
rule:
  all:
    - pattern: '$D.children()'
    - not:
        inside:
          kind: field_expression
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: '$D.nos()'
