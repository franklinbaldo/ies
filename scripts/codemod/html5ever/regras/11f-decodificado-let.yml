id: 11f-decodificado-let
language: rust
message: 'O let y = decodificar_atributo(&b) sai (valor já decodificado; usos na 11e)'
severity: hint
rule:
  all:
    - any:
        - pattern: 'let $Y = decodificar_atributo(&$B);'
        - pattern: 'let $Y = crate::formulario_web::decodificar_atributo(&$B);'
    - follows:
        stopBy: end
        kind: let_declaration
        all:
          - has:
              field: pattern
              any:
                - pattern: $B
                - has:
                    stopBy: end
                    pattern: $B
          - has:
              field: value
              stopBy: end
              any:
                - pattern: $T.atributo($K)
                - pattern: $T.texto()
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  B:
    kind: identifier
fix: '/* ies-codemod: remover linha */'
