id: 42-parametro-parser
language: rust
message: "O parâmetro tl::Parser sai: o elemento acessa o próprio documento"
severity: hint
rule:
  all:
    - any:
        - pattern:
            context: "fn f($P: &tl::Parser<$L>) {}"
            selector: parameter
        - all:
            - kind: parameter
            - has:
                field: type
                regex: "^&'[a-z_]+ tl::Parser<"
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix:
  template: "/* ies-codemod: remover linha */"
  expandEnd:
    regex: ","
