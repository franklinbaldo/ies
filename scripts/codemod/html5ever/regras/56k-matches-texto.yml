id: 56k-matches-texto
language: rust
message: "matches!(n, tl::Node::Raw(_)) vira matches!(n, crate::tela_html::No::Texto(_))"
severity: hint
rule:
  all:
    - pattern: "matches!($N, tl::Node::Raw(_))"
