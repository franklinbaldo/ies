id: 21b-elemento-e-classe-em
language: rust
message: 'Elementos por nome e classe entre os descendentes de um elemento.'
severity: hint
rule:
  any:
    - pattern: nos_por_elemento_e_classe($D, Some($R), $N, $C).map_err($E)?
    - pattern: nos_por_elemento_e_classe($D, Some($R), $N, $C)?
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
fix: '$R.elementos($N).filter(|elemento| elemento.tem_classe($C)).collect::<Vec<_>>()'
