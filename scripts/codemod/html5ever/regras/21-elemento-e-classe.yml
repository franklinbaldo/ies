id: 21-elemento-e-classe
language: rust
message: 'Elementos por nome e classe, no documento.'
severity: hint
rule:
  any:
    - pattern: nos_por_elemento_e_classe(&$D, None, $N, $C).map_err($E)?
    - pattern: nos_por_elemento_e_classe(&$D, None, $N, $C)?
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
fix: '$D.elementos($N).filter(|elemento| elemento.tem_classe($C)).collect::<Vec<_>>()'
