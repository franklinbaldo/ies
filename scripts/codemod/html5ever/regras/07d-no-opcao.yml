id: 07d-no-opcao
language: rust
message: 'h.get(parser) que sobrou: o nó é o próprio elemento'
severity: hint
rule:
  all:
    - pattern: '$H.get($P)'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  P:
    regex: '^(parser|.*\.parser\(\))$'
fix: 'Some($H)'
