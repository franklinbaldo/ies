id: 40-tipo-tag
language: rust
message: "&tl::HTMLTag e &tl::Node viram Elemento, passado por valor (é Copy)"
severity: hint
rule:
  all:
    - any:
        - pattern:
            context: "fn f(x: &tl::HTMLTag<$L>) {}"
            selector: reference_type
        - pattern:
            context: "fn f(x: &tl::Node<$L>) {}"
            selector: reference_type
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: "crate::tela_html::Elemento<'_>"
