id: 32-for-sem-collect
language: rust
message: 'for sobre elementos/com_id/filhos/nos(..)…collect::<Vec<_>>() itera direto'
severity: hint
rule:
  all:
    - pattern: 'for $X in $E.collect::<Vec<_>>() { $$$B }'
    - has:
        field: value
        regex: '\.(com_id|elementos|filhos|nos)\('
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: |-
  for $X in $E {
      $$$B
  }
