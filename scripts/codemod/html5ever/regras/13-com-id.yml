id: 13-com-id
language: rust
message: 'Elementos com id no documento.'
severity: hint
rule:
  any:
    - pattern: nos_com_id(&$D, $I).map_err($E)?
    - pattern: nos_com_id(&$D, $I)?
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
fix: '$D.com_id($I).collect::<Vec<_>>()'
