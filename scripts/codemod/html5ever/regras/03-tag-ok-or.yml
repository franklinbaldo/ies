id: 03-tag-ok-or
language: rust
message: 'Ramo impossível: um nó da árvore sempre é o elemento achado.'
severity: hint
rule:
  pattern: $H.get($P).and_then(tl::Node::as_tag).$M($E)?
  not:
    inside:
      stopBy: end
      kind: mod_item
      follows:
        kind: attribute_item
        regex: 'cfg\(test\)'
constraints:
  M:
    regex: '^ok_or(_else)?$'
fix: '$H'
