id: 11g2-sem-segunda-decodificacao-str
language: rust
message: 'decodificar_atributo(b) com b: &str lido por atributo(): o valor já vem decodificado, só a cópia fica'
severity: hint
rule:
  all:
    - any:
        - pattern: 'decodificar_atributo($B)'
        - pattern: 'crate::formulario_web::decodificar_atributo($B)'
    - inside:
        stopBy: end
        follows:
          stopBy: end
          kind: let_declaration
          all:
            - has:
                field: pattern
                any:
                  - pattern: $B
                  - has:
                      stopBy: end
                      pattern: $B
            - has:
                field: value
                stopBy: end
                any:
                  - pattern: $T.atributo($K)
                  - pattern: $T.texto()
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: '$B.to_owned()'
