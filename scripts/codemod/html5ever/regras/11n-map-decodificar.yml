id: 11n-map-decodificar
language: rust
message: 'atributo(k).map(decodificar_atributo): o valor já vem decodificado'
severity: hint
rule:
  all:
    - any:
        - pattern: '$T.atributo($K).map(decodificar_atributo)'
        - pattern: '$T.atributo($K).map(crate::formulario_web::decodificar_atributo)'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: '$T.atributo($K).map(str::to_owned)'
