id: 18f-atributos-map-err-usos-campo
language: rust
message: 'let a = atributos(t).map_err(e)?: a tag sempre é legível (usos) (campo abreviado de struct)'
severity: hint
rule:
  all:
    - kind: identifier
    - pattern: $X
    - inside:
        stopBy: end
        follows:
          stopBy: end
          any:
            - pattern: 'let $X = atributos($H).map_err($E)?;'
            - pattern: 'let $X = crate::html_atributos::atributos($H).map_err($E)?;'
    - not:
        pattern: $H
    - inside:
        kind: shorthand_field_initializer
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  H:
    kind: identifier
fix: '$X: $H'
