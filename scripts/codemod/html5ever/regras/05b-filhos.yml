id: 05b-filhos
language: rust
message: 'Filhos elementos (children().top())'
severity: hint
rule:
  all:
    - any:
        - pattern: '$T.children().top().iter().filter_map(|$H| $H.get($P)).filter_map(tl::Node::as_tag)'
        - pattern: '$T.children().top().iter().filter_map(|$H| $H.get($P).and_then(tl::Node::as_tag))'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: '$T.filhos()'
