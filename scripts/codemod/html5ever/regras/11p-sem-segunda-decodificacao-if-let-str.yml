id: 11p-sem-segunda-decodificacao-if-let-str
language: rust
message: 'decodificar_atributo(b) no corpo de if let Some(b) = t.atributo(k), b: &str: o valor já vem decodificado'
severity: hint
rule:
  all:
    - any:
        - pattern: 'decodificar_atributo($B)'
        - pattern: 'crate::formulario_web::decodificar_atributo($B)'
    - inside:
        stopBy: end
        kind: if_expression
        has:
          field: condition
          kind: let_condition
          all:
            - has:
                field: pattern
                has:
                  stopBy: end
                  pattern: $B
            - has:
                field: value
                pattern: $T.atributo($K)
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  B:
    kind: identifier
fix: '$B.to_owned()'
