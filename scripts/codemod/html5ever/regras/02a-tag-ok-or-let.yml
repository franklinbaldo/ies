id: 02a-tag-ok-or-let
language: rust
message: 'let de um handle resolvido com ok_or: o nome some e os usos passam ao handle (o let)'
severity: hint
rule:
  all:
    - pattern: 'let $X = $H.get($P).and_then(tl::Node::as_tag).ok_or($E)?;'
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
constraints:
  H:
    kind: identifier
fix: '/* ies-codemod: remover linha */'
