id: 01f-tag-de-fatia-no-match-some
language: rust
message: 'Handle de um padrão de fatia ([h]) num braço de match que devolve Result<Option<_>> (map(Some), sem ?): o elemento vem por cópia'
severity: hint
rule:
  all:
    - any:
        - pattern: '$H.get($P).and_then(tl::Node::as_tag).map(Some).ok_or($E)'
        - pattern: '$H.get($P).and_then(tl::Node::as_tag).map(Some).ok_or_else($E)'
    - not:
        inside:
          kind: try_expression
    - inside:
        kind: match_arm
        field: value
        has:
          field: pattern
          has:
            kind: slice_pattern
            has:
              pattern: $H
    - not:
        inside:
          stopBy: end
          kind: mod_item
          follows:
            kind: attribute_item
            regex: 'cfg\(test\)'
fix: 'Ok(Some(*$H))'
